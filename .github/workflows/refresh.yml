name: Daily refresh

on:
  schedule:
    # Weekday closes: 01:30 UTC Tue-Sat is evening after each U.S. session,
    # late enough for end-of-day data to have settled.
    - cron: "30 1 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh universe, history and page
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python -m oklahoma refresh --no-ui
          python -m oklahoma history

      # The offline suite asserts invariants on the files just written
      # (unique tickers, dense ranks, clean chronological bars, coverage),
      # so bad data from the API fails here instead of landing on main.
      - name: Verify the refreshed data
        run: python -m unittest discover -s tests

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Data is already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/index.html
          git commit -m "Daily data refresh ($(date -u +%F))"
          git push
