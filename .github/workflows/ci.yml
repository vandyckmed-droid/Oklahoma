name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite runs against fixtures and the committed data files, so it
      # needs no API key and no network. Nothing to install.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  generated-data-is-current:
    name: Page data matches the history
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/display.json is derived from data/universe.json and the bar
      # files under data/history/. Rebuilding it must be a no-op, or the
      # numbers the page fetches have drifted from the history behind them.
      - name: Rebuild the page data from committed history
        run: python -m oklahoma build-ui

      - name: Fail if the page data changed
        run: |
          if ! git diff --quiet -- data/display.json; then
            echo "data/display.json is out of date. Run: python -m oklahoma build-ui"
            git diff --stat -- data/display.json
            exit 1
          fi
          echo "data/display.json is up to date."
