name: Deploy quotes Worker

# Deploys worker/ to Cloudflare from GitHub, so the FMP key and the
# Cloudflare token both live in this repository's Actions secrets and the
# Cloudflare dashboard never has to be touched.
#
# Required repository secrets:
#   FMP_API_KEY           Financial Modeling Prep key (shared with the
#                         daily refresh workflow)
#   CLOUDFLARE_API_TOKEN  Cloudflare API token created from the
#                         "Edit Cloudflare Workers" template

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 8d3d52b624bad9ac26283d4d342e7bcb
  SITE_ORIGIN: https://vandyckmed-droid.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$FMP_API_KEY" ] || missing="$missing FMP_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
          echo "Both secrets are present."

      # `secret put` binds the key to the Worker (creating a draft Worker
      # first if none exists yet), so the deploy that follows passes the
      # [secrets] required check in wrangler.toml.
      - name: Bind the FMP key to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: printf '%s' "$FMP_API_KEY" | npx --yes wrangler@4 secret put FMP_API_KEY

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # Prove the deployed Worker answers the way the page needs, at the
      # URL the page actually uses: real quotes with the fields the page
      # reads, and the CORS header a browser on the site requires. A
      # freshly created Worker's workers.dev address can answer "error
      # code: 1042" for a minute before Cloudflare finishes wiring it up,
      # so retry.
      - name: Verify live quotes
        working-directory: .
        run: |
          url="$(grep -o 'var DEFAULT_QUOTES_URL = "[^"]*"' web/index.html | cut -d'"' -f2)"
          [ -n "$url" ] || { echo "::error::DEFAULT_QUOTES_URL not found in web/index.html"; exit 1; }
          echo "Page default quotes URL: $url"
          for attempt in $(seq 1 12); do
            out="$(curl -sS -i --max-time 20 -H "Origin: $SITE_ORIGIN" \
              "$url/quotes?symbols=AAPL,MSFT" || true)"
            body="$(printf '%s' "$out" | tr -d '\r' | sed '1,/^$/d')"
            if printf '%s' "$body" | grep -q '"quotes":\[{'; then
              printf '%s\n' "$body" | head -c 600; echo
              printf '%s' "$out" | tr -d '\r' | grep -qi "^access-control-allow-origin: $SITE_ORIGIN\$" \
                || { echo "::error::Missing CORS header for $SITE_ORIGIN"; exit 1; }
              printf '%s' "$body" | grep -q '"changePct":-\?[0-9]' \
                || { echo "::error::Quotes carry no changePct; the Today column would be empty"; exit 1; }
              printf '%s' "$body" | grep -q '"timestamp":[0-9]' \
                || { echo "::error::Quotes carry no timestamp; the page could not show a trade time"; exit 1; }
              echo "Live quotes are working at $url"
              exit 0
            fi
            echo "Attempt $attempt: $(printf '%s' "$body" | head -c 200)"
            sleep 10
          done
          echo "::error::Worker did not return quotes after two minutes"
          exit 1
