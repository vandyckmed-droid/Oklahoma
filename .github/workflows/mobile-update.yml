name: Publish mobile app to Expo Go

# Publishes mobile/ as an EAS Update that opens in Expo Go, with no computer
# involved beyond this runner. Expo Go loads updates for projects the signed-in
# account owns, so the account behind EXPO_TOKEN is the one that must be signed
# in to Expo Go on the phone.
#
# One-time setup, all doable from a phone browser:
#   1. https://expo.dev/settings/access-tokens  →  Create token
#   2. https://github.com/vandyckmed-droid/Oklahoma/settings/secrets/actions
#      →  New repository secret, name EXPO_TOKEN, paste the token
#   3. Actions → this workflow → Run workflow
#
# Each run prints an exp://u.expo.dev/… link in its summary; the app also
# appears under Projects in Expo Go for that account.

on:
  workflow_dispatch: {}
  push:
    branches: [main, "claude/mobile-design-directions-2siy8r"]
    paths: ["mobile/**", ".github/workflows/mobile-update.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-update
  cancel-in-progress: true

jobs:
  publish:
    name: eas update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Without the token there is nothing to do, and failing would only paint
      # the pull request red for a setup step that belongs to the account
      # owner. So the job skips cleanly and says exactly what is missing.
      - name: Is EXPO_TOKEN set?
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not published — EXPO_TOKEN is not set::Create a token at https://expo.dev/settings/access-tokens, then add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions as EXPO_TOKEN and re-run this workflow."
            {
              echo "## Not published: \`EXPO_TOKEN\` is not set"
              echo
              echo "1. https://expo.dev/settings/access-tokens → **Create token**"
              echo "2. https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions → **New repository secret** named \`EXPO_TOKEN\`"
              echo "3. Re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # Creates @<account>/oklahoma-universe on first run and links it on every
      # run after; --force makes both cases silent. The project id is exported
      # so app.config.js can add updates.url, which eas update requires.
      - name: Create or link the EAS project
        if: steps.gate.outputs.ready == 'true'
        id: project
        run: |
          # `eas whoami` prints the username first, then a bulleted list of
          # accounts with roles. Take the first plain line; if it does not look
          # like a username, fall back to the repository owner, which is the
          # same person here. A repository variable EXPO_ACCOUNT overrides both.
          WHO="$(eas whoami 2>/dev/null | grep -vE '^\s*$|•|\(' | head -n1 | tr -d '[:space:]')"
          ACCOUNT="${EXPO_ACCOUNT:-${WHO:-$GITHUB_REPOSITORY_OWNER}}"
          echo "eas whoami says: ${WHO:-<nothing usable>}; publishing as @$ACCOUNT"
          OUT="$(eas init --account "$ACCOUNT" --force --json --non-interactive)"
          echo "$OUT"
          ID="$(echo "$OUT" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const id=j.id||j.projectId||(j.project&&j.project.id);
              if(!id){console.error("no project id in eas init output");process.exit(1)}
              console.log(id);
            })')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Publish the update
        if: steps.gate.outputs.ready == 'true'
        id: update
        env:
          EAS_PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          OUT="$(eas update --branch preview --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}" --json --non-interactive)"
          echo "$OUT"
          GROUP="$(echo "$OUT" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const first=Array.isArray(j)?j[0]:j;
              const g=first.group||first.groupId||(first.updateGroup&&first.updateGroup.id);
              if(!g){console.error("no update group id in eas update output");process.exit(1)}
              console.log(g);
            })')"
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Where to open it
        if: steps.gate.outputs.ready == 'true'
        env:
          ID: ${{ steps.project.outputs.id }}
          GROUP: ${{ steps.update.outputs.group }}
        run: |
          LINK="exp://u.expo.dev/${ID}/group/${GROUP}"
          DASH="https://expo.dev/projects/${ID}/updates/${GROUP}"
          {
            echo "## Oklahoma is published to Expo Go"
            echo
            echo "On the phone that is signed in to the same Expo account:"
            echo
            echo "- **Tap:** [$LINK]($LINK)"
            echo "- **Or** open Expo Go → Projects → *Oklahoma*"
            echo "- **Or** scan the QR on the update page: $DASH"
            echo
            echo "Runtime: \`exposdk:57.0.0\` — matches Expo Go for SDK 57."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$LINK"
