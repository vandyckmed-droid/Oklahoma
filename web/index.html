<style>
  :root {
    --ground: #f3f5f4;
    --surface: #ffffff;
    --surface-sunk: #eef1f0;
    --ink: #101917;
    --muted: #5d6b68;
    --faint: #8a9895;
    --line: #dee5e3;
    --accent: #0c6b5f;
    --accent-soft: #e1efec;
    --up: #1a7f52;
    --down: #b4443c;
    --warn: #9a6a17;
    --shadow: 0 1px 2px rgba(16, 25, 23, .06), 0 8px 24px -16px rgba(16, 25, 23, .3);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0c1211;
      --surface: #141d1b;
      --surface-sunk: #101817;
      --ink: #e7eeec;
      --muted: #93a6a2;
      --faint: #6d807c;
      --line: #22302d;
      --accent: #48c6b0;
      --accent-soft: #16302c;
      --up: #4fbe86;
      --down: #e2796f;
      --warn: #d9a445;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0c1211;
    --surface: #141d1b;
    --surface-sunk: #101817;
    --ink: #e7eeec;
    --muted: #93a6a2;
    --faint: #6d807c;
    --line: #22302d;
    --accent: #48c6b0;
    --accent-soft: #16302c;
    --up: #4fbe86;
    --down: #e2796f;
    --warn: #d9a445;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 56px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 28px 0 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- summary ---------- */

  .summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat {
    background: var(--surface);
    padding: 12px 12px 13px;
  }
  .stat dt {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  .note {
    margin: 10px 2px 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }
  .note b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    color: var(--ink);
  }

  /* ---------- price history ---------- */

  .spark {
    display: block;
    width: 54px;
    height: 18px;
    margin-top: 3px;
    margin-left: auto;
    overflow: visible;
  }
  .spark path { fill: none; stroke-width: 1.4; }
  .spark .fill { stroke: none; opacity: .16; }
  .spark circle { stroke: none; }

  .chg {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .warn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--warn);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  .detail .series {
    grid-column: 1 / -1;
    margin-top: 6px;
  }
  .detail .series svg {
    display: block;
    width: 100%;
    height: 56px;
    overflow: visible;
  }
  .detail .axis {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    margin-top: 3px;
  }

  /* ---------- controls ---------- */

  .controls { margin-top: 18px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 12px;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { flex: none; color: var(--faint); }
  .search input {

    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 11px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }

  .filters {

    gap: 6px;
    margin-top: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
  }
  .chip .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .resultline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 18px 2px 8px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .resultline button {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .resultline button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }

  .sector-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--surface-sunk);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sector-head .n {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;

  .row:focus-visible {

  .rank {

    color: var(--faint);

  .ticker {

    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .name-cell {
    min-width: 0;
  }
  .company {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cap {
    text-align: right;

    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;

  .weight {
    display: block;
    margin-top: 4px;
    margin-left: auto;
    width: 46px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .weight i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--sector, var(--accent));
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
    flex: none;
  }

  .detail {
    padding: 0 14px 14px 52px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    font-size: 12.5px;
  }
  .detail dt { color: var(--faint); }
  .detail dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;

  footer {

    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;

  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color .12s ease; }
  }
  @media (min-width: 480px) {
    h1 { font-size: 40px; }
    .company { font-size: 13px; }
  }
</style>

    }

    function money(value) {
      if (value >= 1e12) return "$" + (value / 1e12).toFixed(2) + "T";
      if (value >= 1e9) return "$" + (value / 1e9).toFixed(0) + "B";
      if (value >= 1e6) return "$" + (value / 1e6).toFixed(0) + "M";
      return "$" + value.toLocaleString();
    }

    function pct(value) {
      if (value == null) return "—";
      return (value > 0 ? "+" : "") + value.toFixed(2) + "%";
    }

    function direction(value) {
      if (value == null) return "flat";
      if (value > 0.005) return "up";
      if (value < -0.005) return "down";
      return "flat";
    }

    var SVG = "http://www.w3.org/2000/svg";

    function sparkPoints(series, width, height) {
      var lo = Math.min.apply(null, series);
      var hi = Math.max.apply(null, series);
      var span = hi - lo || 1;
      var step = series.length > 1 ? width / (series.length - 1) : 0;
      return series.map(function (value, i) {
        return [i * step, height - ((value - lo) / span) * height];
      });
    }

    function spark(series, width, height, stroke, withFill) {
      var svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      if (!series || series.length < 2) return svg;

      var pts = sparkPoints(series, width, height);
      var d = pts.map(function (p, i) {
        return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
      }).join(" ");

      if (withFill) {
        var area = document.createElementNS(SVG, "path");
        area.setAttribute("class", "fill");
        area.setAttribute("fill", stroke);
        area.setAttribute("d", d + " L" + width + " " + height + " L0 " + height + " Z");
        svg.appendChild(area);
      }

      var line = document.createElementNS(SVG, "path");
      line.setAttribute("d", d);
      line.setAttribute("stroke", stroke);
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("stroke-linejoin", "round");
      svg.appendChild(line);

      // The endpoint is where the price actually is; mark it.
      var end = pts[pts.length - 1];
      var dot = document.createElementNS(SVG, "circle");
      dot.setAttribute("cx", end[0].toFixed(2));
      dot.setAttribute("cy", end[1].toFixed(2));
      dot.setAttribute("r", "1.7");
      dot.setAttribute("fill", stroke);
      svg.appendChild(dot);
      return svg;
    }

    function asOf(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    var totalCap = rows.reduce(function (sum, r) { return sum + r.market_cap; }, 0);
    var largestCap = rows.reduce(function (max, r) { return Math.max(max, r.market_cap); }, 0);

    var sectorCounts = {};
    rows.forEach(function (r) {
      sectorCounts[r.sector] = (sectorCounts[r.sector] || 0) + 1;
    });
    var sectors = Object.keys(sectorCounts).sort(function (a, b) {
      return sectorCounts[b] - sectorCounts[a] || a.localeCompare(b);
    });

    document.getElementById("subtitle").textContent =
      universe.count + " largest U.S.-listed companies by market cap · as of " + asOf(universe.generated_at);
    document.getElementById("stat-count").textContent = universe.count;
    document.getElementById("stat-cap").textContent = money(totalCap);
    document.getElementById("stat-sectors").textContent = sectors.length;

    if (hasHistory) {
      var target = history.criteria.trading_days_target;
      document.getElementById("stat-history-tile").hidden = false;
      document.getElementById("stat-history-label").textContent = target + "d history";
      document.getElementById("stat-history").textContent =
        history.sufficient_count + "/" + history.count;

      var short = history.coverage.filter(function (e) { return !e.sufficient; });
      var note = document.getElementById("history-note");
      note.hidden = false;
      if (short.length) {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) + ". " +
          short.length + " name" + (short.length > 1 ? "s have" : " has") +
          " less than " + target + " trading days of history: " +
          short.map(function (e) {
            return "<b>" + e.ticker + "</b> (" + e.trading_days + "d)";
          }).join(", ") + ".";
      } else {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) +
          ". Every name covers at least " + target + " trading days.";
      }
    }

    var source = universe.source || {};
    document.getElementById("footer").innerHTML =
      "Data from " + (source.provider || "the configured provider") +
      ", <code>" + (source.endpoint || "") + "</code>. Universe size and exchanges are set in " +
      "<code>oklahoma/config.py</code>; run <code>python -m oklahoma refresh --size N</code> to grow it." +
      (hasHistory
        ? " Prices are split- and dividend-adjusted closes; the page carries a thinned " +
          "series per name, the full history lives in <code>data/history/</code>."
        : "");

    /* ----- state ----- */

    var state = { query: "", sector: null, grouped: false, open: null };

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var groupBtn = document.getElementById("groupToggle");

    function chip(label, value, count, color) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (color) b.style.setProperty("--sector", color);
      if (color) {
        var dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.appendChild(document.createTextNode(label));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        state.open = null;
        renderFilters();
        renderList();
      });
      return b;
    }

    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(chip("All", null, rows.length, null));
      sectors.forEach(function (s) {
        filtersEl.appendChild(chip(s, s, sectorCounts[s], sectorColor(s)));
      });
    }

    function visible() {
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    function detailList(r) {
      var dl = document.createElement("dl");
      dl.className = "detail";
      var pairs = [
        ["Sector", r.sector],
        ["Industry", r.industry || "—"],
        ["Exchange", r.exchange || "—"],
        ["Market cap", "$" + r.market_cap.toLocaleString()],
        ["Share of universe", ((r.market_cap / totalCap) * 100).toFixed(2) + "%"]
      ];
      if (r.price != null) pairs.push(["Last price", "$" + r.price.toLocaleString()]);
      if (r.share_classes && r.share_classes.length > 1) {
        pairs.push(["Share classes", r.share_classes.join(", ")]);
      }

      var cov = coverage[r.ticker];
      if (cov) {
        pairs.push(["Trading days", cov.trading_days + (cov.sufficient ? "" : " — short")]);
        pairs.push(["Loaded", cov.start_date + " \u2192 " + cov.end_date]);
        if (cov.last_adj_close != null) {
          pairs.push(["Last adj. close", "$" + cov.last_adj_close.toLocaleString()]);
        }
        if (cov.window_return_pct != null) {
          pairs.push([
            cov.window_trading_days + "-day return",
            pct(cov.window_return_pct)
          ]);
        }
        if (cov.window_low != null) {
          pairs.push([
            "Adj. close range",
            "$" + cov.window_low.toLocaleString() + " – $" + cov.window_high.toLocaleString()
          ]);
        }
      }
      pairs.forEach(function (pair) {
        var dt = document.createElement("dt");
        dt.textContent = pair[0];
        var dd = document.createElement("dd");
        dd.textContent = pair[1];
        dl.appendChild(dt);
        dl.appendChild(dd);
      });

      if (cov && cov.sparkline && cov.sparkline.length > 1) {
        var wrap = document.createElement("div");
        wrap.className = "series";
        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        wrap.appendChild(spark(cov.sparkline, 300, 56, stroke, true));
        var axis = document.createElement("div");
        axis.className = "axis";
        var from = document.createElement("span");
        from.textContent = cov.window_start_date || cov.start_date;
        var to = document.createElement("span");
        to.textContent = cov.end_date;
        axis.appendChild(from);
        axis.appendChild(to);
        wrap.appendChild(axis);
        dl.appendChild(wrap);
      }
      return dl;
    }

    function rowItem(r) {
      var li = document.createElement("li");
      var color = sectorColor(r.sector);
      var isOpen = state.open === r.ticker;
      var cov = coverage[r.ticker];

      var button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.setAttribute("aria-expanded", String(isOpen));
      button.style.setProperty("--sector", color);

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = r.rank;

      var main = document.createElement("span");
      main.className = "name-cell";
      var ticker = document.createElement("span");
      ticker.className = "ticker";
      ticker.textContent = r.ticker;
      if (cov && cov.window_return_pct != null) {
        var chg = document.createElement("span");
        chg.className = "chg " + direction(cov.window_return_pct);
        chg.textContent = " " + pct(cov.window_return_pct);
        ticker.appendChild(chg);
      }
      if (cov && !cov.sufficient) {
        var warn = document.createElement("span");
        warn.className = "warn";
        warn.textContent = cov.trading_days + "d";
        warn.title = "Only " + cov.trading_days + " trading days of history";
        ticker.appendChild(document.createTextNode(" "));
        ticker.appendChild(warn);
      }

      var company = document.createElement("span");
      company.className = "company";
      company.textContent = r.name;
      main.appendChild(ticker);
      main.appendChild(company);

      var cap = document.createElement("span");
      cap.className = "cap";
      var capValue = document.createElement("b");
      capValue.textContent = money(r.market_cap);
      cap.appendChild(capValue);

      if (cov && cov.sparkline && cov.sparkline.length > 1) {
        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        var mini = spark(cov.sparkline, 54, 18, stroke, false);
        mini.setAttribute("class", "spark");
        cap.appendChild(mini);
      } else {
        var bar = document.createElement("span");
        bar.className = "weight";
        var fill = document.createElement("i");
        fill.style.width = Math.max(4, (r.market_cap / largestCap) * 100) + "%";
        bar.appendChild(fill);
        cap.appendChild(bar);
      }

      button.appendChild(rank);
      button.appendChild(main);
      button.appendChild(cap);
      button.addEventListener("click", function () {
        state.open = isOpen ? null : r.ticker;
        renderList();
      });

      li.appendChild(button);
      if (isOpen) li.appendChild(detailList(r));
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      li.className = "sector-head";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--sector", sectorColor(name));
      dot.style.width = "7px";
      dot.style.height = "7px";
      dot.style.borderRadius = "50%";
      dot.style.background = sectorColor(name);
      li.appendChild(dot);
      li.appendChild(document.createTextNode(name));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      li.appendChild(n);
      return li;
    }

    function renderList() {
      var shown = visible();
      listEl.textContent = "";
      resultEl.textContent =
        shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";

      if (!shown.length) {
        var li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
        listEl.appendChild(li);
        return;
      }

      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          listEl.appendChild(sectorHeader(s, group.length));
          group.forEach(function (r) { listEl.appendChild(rowItem(r)); });
        });
      } else {
        shown.forEach(function (r) { listEl.appendChild(rowItem(r)); });
      }
    }

    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      state.open = null;
      renderList();
    });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-pressed", String(state.grouped));
      groupBtn.textContent = state.grouped ? "Sort by market cap" : "Group by sector";
      renderList();
    });

    renderFilters();
    renderList();
  })();
</script>

</body>
</html>
