<style>
  :root {
    --ground: #f3f5f4;
    --surface: #ffffff;
    --surface-sunk: #eef1f0;
    --ink: #101917;
    --muted: #5d6b68;
    --faint: #8a9895;
    --line: #dee5e3;
    --accent: #0c6b5f;
    --accent-soft: #e1efec;
    --shadow: 0 1px 2px rgba(16, 25, 23, .06), 0 8px 24px -16px rgba(16, 25, 23, .3);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0c1211;
      --surface: #141d1b;
      --surface-sunk: #101817;
      --ink: #e7eeec;
      --muted: #93a6a2;
      --faint: #6d807c;
      --line: #22302d;
      --accent: #48c6b0;
      --accent-soft: #16302c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0c1211;
    --surface: #141d1b;
    --surface-sunk: #101817;
    --ink: #e7eeec;
    --muted: #93a6a2;
    --faint: #6d807c;
    --line: #22302d;
    --accent: #48c6b0;
    --accent-soft: #16302c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 56px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 28px 0 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- summary ---------- */

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat {
    background: var(--surface);
    padding: 12px 12px 13px;
  }
  .stat dt {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  /* ---------- controls ---------- */

  .controls { margin-top: 18px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 12px;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { flex: none; color: var(--faint); }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 11px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
  }
  .chip .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .resultline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 18px 2px 8px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .resultline button {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .resultline button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }

  .sector-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--surface-sunk);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sector-head .n {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;
  }
  .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .rank {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .ticker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .name-cell {
    min-width: 0;
  }
  .company {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cap {
    text-align: right;
  }
  .cap b {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .weight {
    display: block;
    margin-top: 4px;
    margin-left: auto;
    width: 46px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .weight i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--sector, var(--accent));
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
    flex: none;
  }

  .detail {
    padding: 0 14px 14px 52px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    font-size: 12.5px;
  }
  .detail dt { color: var(--faint); }
  .detail dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  footer {
    margin-top: 22px;
    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;
  }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color .12s ease; }
  }
  @media (min-width: 480px) {
    h1 { font-size: 40px; }
    .company { font-size: 13px; }
  }
</style>

      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    var totalCap = rows.reduce(function (sum, r) { return sum + r.market_cap; }, 0);
    var largestCap = rows.reduce(function (max, r) { return Math.max(max, r.market_cap); }, 0);

    var sectorCounts = {};
    rows.forEach(function (r) {
      sectorCounts[r.sector] = (sectorCounts[r.sector] || 0) + 1;
    });
    var sectors = Object.keys(sectorCounts).sort(function (a, b) {
      return sectorCounts[b] - sectorCounts[a] || a.localeCompare(b);
    });

    document.getElementById("subtitle").textContent =
      universe.count + " largest U.S.-listed companies by market cap · as of " + asOf(universe.generated_at);
    document.getElementById("stat-count").textContent = universe.count;
    document.getElementById("stat-cap").textContent = money(totalCap);
    document.getElementById("stat-sectors").textContent = sectors.length;

    var source = universe.source || {};
    document.getElementById("footer").innerHTML =
      "Data from " + (source.provider || "the configured provider") +
      ", <code>" + (source.endpoint || "") + "</code>. Universe size and exchanges are set in " +
      "<code>oklahoma/config.py</code>; run <code>python -m oklahoma refresh --size N</code> to grow it.";

    /* ----- state ----- */

    var state = { query: "", sector: null, grouped: false, open: null };

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var groupBtn = document.getElementById("groupToggle");

    function chip(label, value, count, color) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (color) b.style.setProperty("--sector", color);
      if (color) {
        var dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.appendChild(document.createTextNode(label));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        state.open = null;
        renderFilters();
        renderList();
      });
      return b;
    }

    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(chip("All", null, rows.length, null));
      sectors.forEach(function (s) {
        filtersEl.appendChild(chip(s, s, sectorCounts[s], sectorColor(s)));
      });
    }

    function visible() {
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    function detailList(r) {
      var dl = document.createElement("dl");
      dl.className = "detail";
      var pairs = [
        ["Sector", r.sector],
        ["Industry", r.industry || "—"],
        ["Exchange", r.exchange || "—"],
        ["Market cap", "$" + r.market_cap.toLocaleString()],
        ["Share of universe", ((r.market_cap / totalCap) * 100).toFixed(2) + "%"]
      ];
      if (r.price != null) pairs.push(["Last price", "$" + r.price.toLocaleString()]);
      if (r.share_classes && r.share_classes.length > 1) {
        pairs.push(["Share classes", r.share_classes.join(", ")]);
      }
      pairs.forEach(function (pair) {
        var dt = document.createElement("dt");
        dt.textContent = pair[0];
        var dd = document.createElement("dd");
        dd.textContent = pair[1];
        dl.appendChild(dt);
        dl.appendChild(dd);
      });
      return dl;
    }

    function rowItem(r) {
      var li = document.createElement("li");
      var color = sectorColor(r.sector);
      var isOpen = state.open === r.ticker;

      var button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.setAttribute("aria-expanded", String(isOpen));
      button.style.setProperty("--sector", color);

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = r.rank;

      var main = document.createElement("span");
      main.className = "name-cell";
      var ticker = document.createElement("span");
      ticker.className = "ticker";
      ticker.textContent = r.ticker;
      var company = document.createElement("span");
      company.className = "company";
      company.textContent = r.name;
      main.appendChild(ticker);
      main.appendChild(company);

      var cap = document.createElement("span");
      cap.className = "cap";
      var capValue = document.createElement("b");
      capValue.textContent = money(r.market_cap);
      var bar = document.createElement("span");
      bar.className = "weight";
      var fill = document.createElement("i");
      fill.style.width = Math.max(4, (r.market_cap / largestCap) * 100) + "%";
      bar.appendChild(fill);
      cap.appendChild(capValue);
      cap.appendChild(bar);

      button.appendChild(rank);
      button.appendChild(main);
      button.appendChild(cap);
      button.addEventListener("click", function () {
        state.open = isOpen ? null : r.ticker;
        renderList();
      });

      li.appendChild(button);
      if (isOpen) li.appendChild(detailList(r));
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      li.className = "sector-head";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--sector", sectorColor(name));
      dot.style.width = "7px";
      dot.style.height = "7px";
      dot.style.borderRadius = "50%";
      dot.style.background = sectorColor(name);
      li.appendChild(dot);
      li.appendChild(document.createTextNode(name));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      li.appendChild(n);
      return li;
    }

    function renderList() {
      var shown = visible();
      listEl.textContent = "";
      resultEl.textContent =
        shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";

      if (!shown.length) {
        var li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
        listEl.appendChild(li);
        return;
      }

      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          listEl.appendChild(sectorHeader(s, group.length));
          group.forEach(function (r) { listEl.appendChild(rowItem(r)); });
        });
      } else {
        shown.forEach(function (r) { listEl.appendChild(rowItem(r)); });
      }
    }

    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      state.open = null;
      renderList();
    });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-pressed", String(state.grouped));
      groupBtn.textContent = state.grouped ? "Sort by market cap" : "Group by sector";
      renderList();
    });

    renderFilters();
    renderList();
  })();
</script>

</body>
</html>
