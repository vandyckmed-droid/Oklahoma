<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oklahoma Universe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
  :root {
    --ground: #f3f5f4;
    --surface: #ffffff;
    --surface-sunk: #eef1f0;
    --ink: #101917;
    --muted: #5d6b68;
    --faint: #8a9895;
    --line: #dee5e3;
    --accent: #0c6b5f;
    --accent-soft: #e1efec;
    --up: #1a7f52;
    --down: #b4443c;
    --warn: #9a6a17;
    --shadow: 0 1px 2px rgba(16, 25, 23, .06), 0 8px 24px -16px rgba(16, 25, 23, .3);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #000000;
      --surface: #0e0e0e;
      --surface-sunk: #070707;
      --ink: #f5f5f5;
      --muted: #9c9c9c;
      --faint: #6e6e6e;
      --line: #1f1f1f;
      --accent: #00c805;
      --accent-soft: #06290e;
      --up: #00c805;
      --down: #ff5000;
      --warn: #d9a445;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #000000;
    --surface: #0e0e0e;
    --surface-sunk: #070707;
    --ink: #f5f5f5;
    --muted: #9c9c9c;
    --faint: #6e6e6e;
    --line: #1f1f1f;
    --accent: #00c805;
    --accent-soft: #06290e;
    --up: #00c805;
    --down: #ff5000;
    --warn: #d9a445;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 56px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 28px 0 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .note {
    margin: 10px 2px 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }
  .note.stale {
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--warn);
  }
  .note b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    color: var(--ink);
  }

  /* ---------- price history ---------- */

  .spark {
    display: block;
    width: 54px;
    height: 18px;
    margin-top: 3px;
    margin-left: auto;
    overflow: visible;
  }

  .chg {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .warn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--warn);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  .star-mark { color: var(--warn); font-size: 11px; }
  .watch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .watch-btn {
    border: 1px solid var(--line);
    background: var(--surface-sunk);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .watch-btn[aria-pressed="true"] {
    border-color: var(--warn);
    color: var(--warn);
  }
  .watch-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .watch-ctx {
    font-size: 11px;
    color: var(--muted);
  }
  .detail-meta {
    margin-top: 0;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--faint);
  }
  .detail .series { margin-top: 2px; }
  .detail .series svg {
    display: block;
    width: 100%;
    height: 56px;
    overflow: visible;
  }
  .detail .axis {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    margin-top: 3px;
  }

  /* ---------- cross-section ---------- */

  /* A real table: header and rows share columns by construction, and a
     screen reader announces each figure with its column's name. */
  .xs {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  .xs th {
    padding: 8px 12px 5px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
    text-align: right;
  }
  .xs th:first-child { text-align: left; }
  /* Fixed layout: the th widths set the columns; the sector column takes
     the remainder and ellipsizes. */
  .xs th:nth-child(2) { width: 86px; }
  .xs th:last-child { width: 84px; }
  .xs td:last-child { padding-left: 2px; }
  .xs td {
    padding: 7px 12px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
  }
  .xs .sn-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .xs .sector-name {
    max-width: 100%;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .xs .sector-name .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
  }
  .xs .med {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    text-align: right;
  }
  .breadth {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .breadth .track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .breadth .track i {
    display: block;
    height: 100%;
    background: var(--up);
    border-radius: 2px;
  }
  .breadth .pct {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
    width: 30px;
    text-align: right;
  }

  .xtreme {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 8px;
  }
  .xlabel {
    flex: none;
    width: 64px;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .xchips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .xchip {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink);
    cursor: pointer;
  }
  .xchip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- controls ---------- */

  .controls { margin-top: 18px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 12px;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { flex: none; color: var(--faint); }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 11px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
  }
  .chip .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .resultline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 18px 2px 6px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .sort-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--faint);
  }
  .sort-wrap select {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 3px 4px;
    font: inherit;
    font-size: 11px;
    max-width: 118px;
  }
  #sortDir {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 2px 8px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
  }
  .resultline button,
  .toolbar button {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .resultline button:focus-visible,
  .toolbar button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #groupToggle[aria-pressed="true"] {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 0 2px 8px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .viewswitch {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }
  .resultline .viewswitch button {
    padding: 3px 9px;
    color: var(--muted);
    letter-spacing: .06em;
    font-size: 10.5px;
  }
  .resultline .viewswitch button + button { border-left: 1px solid var(--line); }
  .resultline .viewswitch button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--ink);
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }

  .sector-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    padding: 9px 14px;
    background: var(--surface-sunk);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }
  .sector-head:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .sector-head .chev {
    color: var(--faint);
    font-size: 10px;
    width: 10px;
    flex: none;
  }
  .sector-head .n {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;
  }
  .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .rank {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .ticker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .name-cell {
    min-width: 0;
  }
  .company {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .company-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cap-sub {
    flex: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }
  /* The right-hand cluster of a card: the shape of the year, then one
     labeled figure chosen from the Show menu. */
  .cap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cap .spark { margin: 0; }
  .metric {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .pill {
    display: inline-block;
    min-width: 72px;
    text-align: center;
    padding: 4px 8px;
    border-radius: 7px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 500;
    background: var(--surface-sunk);
    color: var(--ink);
  }
  .pill.up { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
  .pill.down { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
  .pill-cap {
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  @media (max-width: 359px) {
    .cap .spark { display: none; }
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
    flex: none;
  }

  .detail {
    padding: 0 14px 14px 52px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 12.5px;
  }
  .fact-line {
    color: var(--muted);
    line-height: 1.5;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 10px 9px;
    background: var(--surface-sunk);
  }
  .stat-cell .xl,
  .stat-cell .xl-static {
    align-self: flex-start;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat-val {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 500;
  }
  .stat-sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
  }

  .trend-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px 12px;
    background: var(--surface-sunk);
  }
  .tc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .tc-title {
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .fit-toggle {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    font-size: 10.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .fit-toggle[aria-pressed="true"] {
    border-color: var(--warn);
    color: var(--warn);
  }
  .fit-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tc-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 8px;
  }
  .tc-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .tc-stat .xl {
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .tc-val {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
  }

  .watch-tools[hidden] { display: none; }
  .watch-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 2px 8px;
  }
  .watch-tools button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 5px 10px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .watch-tools button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .watch-tools-note {
    font-size: 10.5px;
    color: var(--faint);
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .xl {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    border-bottom: 1px dotted var(--faint);
  }
  .xl:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #explain-pop {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .5);
  }
  #explain-pop[hidden] { display: none; }
  .ep-card {
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    max-height: 85dvh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 18px 18px 20px;
    box-shadow: var(--shadow);
  }
  .ep-card h2 {
    margin: 0 0 6px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
  }
  .ep-card p {
    margin: 0 0 10px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
  }
  .ep-card code {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .ep-card button {
    border: 1px solid var(--line);
    background: var(--surface-sunk);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .ep-card button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #ep-list {
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  #ep-list dt {
    font-weight: 600;
    margin-top: 10px;
  }
  #ep-list dd {
    margin: 2px 0 0;
    color: var(--muted);
  }
  #ep-list dd code {
    display: block;
    margin: 4px 0 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--ink);
  }

  /* ---------- detail sheet ---------- */

  #detail-pop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .5);
  }
  .dp-card {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    max-height: 88dvh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 14px 16px 24px;
    box-shadow: var(--shadow);
  }
  .dp-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .dp-ticker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 18px;
    font-weight: 600;
  }
  .dp-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dp-close {
    border: 1px solid var(--line);
    background: var(--surface-sunk);
    color: var(--ink);
    border-radius: 8px;
    padding: 5px 11px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .dp-close:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .dp-card .detail { padding: 0; }
  html.sheet-open { overflow: hidden; }

  /* ---------- table view ---------- */

  /* The table scrolls inside its own region: a sticky header and a
     sticky ticker column only hold inside the element that scrolls,
     so this wrapper, not the page, is the scroller. */
  .table-wrap {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: auto;
    max-height: 78vh;
    max-height: 78dvh;
    -webkit-overflow-scrolling: touch;
  }
  .grid {
    border-collapse: separate;
    border-spacing: 0;
    min-width: 100%;
  }
  .grid th,
  .grid td {
    padding: 8px 10px;
    white-space: nowrap;
    text-align: right;
    border-bottom: 1px solid var(--line);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .grid thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface-sunk);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .grid th:first-child,
  .grid td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    text-align: left;
    background: var(--surface);
    box-shadow: 1px 0 0 var(--line);
  }
  .grid thead th:first-child {
    z-index: 3;
    background: var(--surface-sunk);
  }
  .grid th:nth-child(2),
  .grid td:nth-child(2) { text-align: left; }
  .grid .tsector {
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--muted);
  }
  .grid .tsector .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .th-sort {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .th-sort:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .grid th[aria-sort] .th-sort { color: var(--ink); }
  .grid tbody tr { cursor: pointer; }
  .tcell {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tcell:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tcell .ticker { font-size: 13px; }
  .tcell .tname {
    max-width: 118px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 10.5px;
    color: var(--faint);
  }
  .grid td.empty {
    text-align: center;
    white-space: normal;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }

  footer {
    margin-top: 22px;
    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;
  }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color .12s ease; }
  }
  @media (min-width: 480px) {
    h1 { font-size: 40px; }
    .company { font-size: 13px; }
  }
</style>

    var history = JSON.parse(document.getElementById("history-data").textContent);
    var coverage = {};
    ((history && history.coverage) || []).forEach(function (entry) {
      coverage[entry.ticker] = entry;
    });
    var hasHistory = Boolean(history && history.coverage && history.coverage.length);

    var SECTOR_COLORS = {
      "Technology": "#3f8ecf",
      "Communication Services": "#7a6ed0",
      "Consumer Cyclical": "#d08a3f",
      "Consumer Defensive": "#a99a35",
      "Financial Services": "#2fa08a",
      "Healthcare": "#cf5f7a",
      "Energy": "#a5623c",
      "Industrials": "#6f8ba0",
      "Basic Materials": "#4fa04f",
      "Real Estate": "#c07ab0",
      "Utilities": "#c9a93c",
      "Unclassified": "#8a9895"
    };
    function sectorColor(name) {
      return SECTOR_COLORS[name] || "#8a9895";
    }

    function money(value) {
      if (value >= 1e12) return "$" + (value / 1e12).toFixed(2) + "T";
      if (value >= 1e9) return "$" + (value / 1e9).toFixed(0) + "B";
      if (value >= 1e6) return "$" + (value / 1e6).toFixed(0) + "M";
      return "$" + value.toLocaleString();
    }

    function pct(value) {
      if (value == null) return "—";
      return (value > 0 ? "+" : "") + value.toFixed(2) + "%";
    }

    function direction(value) {
      if (value == null) return "flat";
      if (value > 0.005) return "up";
      if (value < -0.005) return "down";
      return "flat";
    }

    var SVG = "http://www.w3.org/2000/svg";

    function sparkPoints(series, width, height, baseline, domain) {
      var lo = Math.min.apply(null, domain || series);
      var hi = Math.max.apply(null, domain || series);
      if (baseline != null) {
        lo = Math.min(lo, baseline);
        hi = Math.max(hi, baseline);
      }
      var span = hi - lo || 1;
      var step = series.length > 1 ? width / (series.length - 1) : 0;
      var pts = series.map(function (value, i) {
        return [i * step, height - ((value - lo) / span) * height];
      });
      pts.baselineY = baseline == null
        ? height
        : height - ((baseline - lo) / span) * height;
      return pts;
    }

    function spark(series, width, height, stroke, withFill, baseline, overlay) {
      var svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      if (!series || series.length < 2) return svg;

      var domain = overlay ? series.concat(overlay) : null;
      var pts = sparkPoints(series, width, height, baseline, domain);
      var d = pts.map(function (p, i) {
        return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
      }).join(" ");
      var floor = pts.baselineY.toFixed(2);

      if (withFill) {
        var area = document.createElementNS(SVG, "path");
        area.setAttribute("fill", stroke);
        area.setAttribute("fill-opacity", "0.16");
        area.setAttribute("d", d + " L" + width + " " + floor + " L0 " + floor + " Z");
        svg.appendChild(area);
      }

      if (baseline != null) {
        var rule = document.createElementNS(SVG, "line");
        rule.setAttribute("x1", "0");
        rule.setAttribute("x2", String(width));
        rule.setAttribute("y1", floor);
        rule.setAttribute("y2", floor);
        rule.setAttribute("stroke-width", "1");
        rule.setAttribute("stroke-dasharray", "3 4");
        rule.style.stroke = "var(--faint)";
        rule.style.opacity = ".55";
        svg.appendChild(rule);
      }

      var line = document.createElementNS(SVG, "path");
      line.setAttribute("d", d);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke-width", "1.4");
      line.setAttribute("stroke", stroke);
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("stroke-linejoin", "round");
      svg.appendChild(line);

      if (overlay && overlay.length > 1) {
        var opts = sparkPoints(overlay, width, height, baseline, domain);
        var od = opts.map(function (p, i) {
          return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
        }).join(" ");
        var fitLine = document.createElementNS(SVG, "path");
        fitLine.setAttribute("d", od);
        fitLine.setAttribute("fill", "none");
        fitLine.setAttribute("stroke-width", "1.3");
        fitLine.setAttribute("stroke-dasharray", "4 3");
        fitLine.style.stroke = "var(--warn)";
        svg.appendChild(fitLine);
      }

      // The endpoint is where the price actually is; mark it.
      var end = pts[pts.length - 1];
      var dot = document.createElementNS(SVG, "circle");
      dot.setAttribute("cx", end[0].toFixed(2));
      dot.setAttribute("cy", end[1].toFixed(2));
      dot.setAttribute("r", "1.7");
      dot.setAttribute("fill", stroke);
      svg.appendChild(dot);
      return svg;
    }

    function asOf(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    var totalCap = rows.reduce(function (sum, r) { return sum + r.market_cap; }, 0);

    var sectorCounts = {};
    rows.forEach(function (r) {
      sectorCounts[r.sector] = (sectorCounts[r.sector] || 0) + 1;
    });
    var sectors = Object.keys(sectorCounts).sort(function (a, b) {
      return sectorCounts[b] - sectorCounts[a] || a.localeCompare(b);
    });

    var sourceName = (universe.source && universe.source.index) || "U.S.-listed companies";
    document.getElementById("subtitle").textContent =
      universe.count + " " + sourceName + " constituents · " + money(totalCap) +
      " · " + sectors.length + " sectors · as of " + asOf(universe.generated_at);
    var ageDays = (Date.now() - new Date(universe.generated_at)) / 86400000;
    if (ageDays > 5) {
      var stale = document.getElementById("stale-note");
      stale.hidden = false;
      stale.textContent =
        "This data is " + Math.floor(ageDays) + " days old. The daily refresh " +
        "may be failing \u2014 check the repository's Actions tab.";
    }

    if (hasHistory) {
      var target = history.criteria.trading_days_target;
      var short = history.coverage.filter(function (e) { return !e.sufficient; });
      var note = document.getElementById("history-note");
      note.hidden = false;
      if (short.length) {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) + ". " +
          short.length + " name" + (short.length > 1 ? "s have" : " has") +
          " less than " + target + " trading days of history: " +
          short.map(function (e) {
            return "<b>" + e.ticker + "</b> (" + e.trading_days + "d)";
          }).join(", ") + ".";
      } else {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) +
          ". Every name covers at least " + target + " trading days.";
      }
    }

    var changes = (history && history.recent_changes) || [];
    if (changes.length) {
      var parts = [];
      changes.slice().reverse().forEach(function (event) {
        var bits = [];
        event.joined.forEach(function (r) { bits.push("+" + r.ticker); });
        event.left.forEach(function (r) { bits.push("\u2212" + r.ticker); });
        event.renamed.forEach(function (r) { bits.push(r.from_ticker + "\u2192" + r.to_ticker); });
        parts.push(asOf(event.observed_at) + ": <b>" + bits.join("</b>, <b>") + "</b>");
      });
      var changesNote = document.getElementById("changes-note");
      changesNote.hidden = false;
      changesNote.innerHTML = "Membership changes \u2014 " + parts.join(" \u00b7 ");
    }

    var cross = history && history.cross_section;
    var rowByTicker = {};
    rows.forEach(function (r) { rowByTicker[r.ticker] = r; });
    var medianBySector = {};
    ((cross && cross.sectors) || []).forEach(function (row) {
      medianBySector[row.sector] = row.median_return_pct;
    });
    if (cross) {
      document.getElementById("cross").hidden = false;
      document.getElementById("cross-title").textContent =
        "12-month cross-section \u00b7 " + cross.names_used + " names";

      var sectorList = document.getElementById("xs-sectors");
      cross.sectors.forEach(function (row) {
        var tr = document.createElement("tr");
        var nameCell = document.createElement("td");
        var medCell = document.createElement("td");
        var breadthCell = document.createElement("td");

        var name = document.createElement("span");
        name.className = "sector-name";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.cssText =
          "width:7px;height:7px;border-radius:50%;flex:none;background:" +
          sectorColor(row.sector);
        name.appendChild(dot);
        var label = document.createElement("span");
        label.className = "sn-text";
        label.textContent = row.sector;
        name.appendChild(label);
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = row.count;
        name.appendChild(n);

        medCell.className = "med " + direction(row.median_return_pct);
        medCell.textContent = pct(row.median_return_pct);

        var breadth = document.createElement("span");
        breadth.className = "breadth";
        breadth.title = row.breadth_pct + "% of names positive";
        var track = document.createElement("span");
        track.className = "track";
        var fill = document.createElement("i");
        fill.style.width = row.breadth_pct + "%";
        track.appendChild(fill);
        var pctEl = document.createElement("span");
        pctEl.className = "pct";
        pctEl.textContent = Math.round(row.breadth_pct) + "%";
        breadth.appendChild(track);
        breadth.appendChild(pctEl);

        nameCell.appendChild(name);
        breadthCell.appendChild(breadth);
        tr.appendChild(nameCell);
        tr.appendChild(medCell);
        tr.appendChild(breadthCell);
        sectorList.appendChild(tr);
      });

      function chipRow(container, names) {
        names.forEach(function (row) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "xchip";
          var tick = document.createElement("span");
          tick.textContent = row.ticker + " ";
          var value = document.createElement("span");
          value.className = direction(row.return_pct);
          value.textContent = pct(row.return_pct);
          chip.appendChild(tick);
          chip.appendChild(value);
          chip.addEventListener("click", function () {
            var input = document.getElementById("search");
            input.value = row.ticker;
            state.query = row.ticker;
            // The chip names one specific ticker; an active sector filter
            // would only hide it, so clear the filter with the chips' UI.
            state.sector = null;
            renderFilters();
            renderList();
            listEl.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          container.appendChild(chip);
        });
      }
      chipRow(document.getElementById("xs-leaders"), cross.leaders);
      chipRow(document.getElementById("xs-laggards"), cross.laggards);
    }

    var source = universe.source || {};
    document.getElementById("footer").innerHTML =
      "Data from " + (source.provider || "the configured provider") +
      ", <code>" + (source.endpoint || "") + "</code>. The universe mirrors current " +
      sourceName + " membership; <code>python -m oklahoma refresh</code> updates it." +
      (hasHistory
        ? " Prices are split- and dividend-adjusted closes; the page carries a thinned " +
          "series per name, the full history lives in <code>data/history/</code>."
        : "");

    /* ----- state ----- */

    var state = {
      query: "", sector: null, grouped: false,
      sortKey: "cap", sortDesc: true, watchOnly: false, showTrend: false,
      view: "cards", display: "ret12"
    };
    var collapsedSectors = new Set();

    // View, shown figure and sort survive a reload on this device. They
    // are conveniences: an unreadable store just means the defaults.
    var PREFS_KEY = "oklahoma-prefs";
    function loadPrefs() {
      var p;
      try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}"); } catch (e) { return; }
      if (!p || typeof p !== "object") return;
      if (p.view === "table" || p.view === "cards") state.view = p.view;
      if (METRICS[p.display]) state.display = p.display;
      if (METRICS[p.sortKey]) state.sortKey = p.sortKey;
      if (typeof p.sortDesc === "boolean") state.sortDesc = p.sortDesc;
    }
    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          view: state.view, display: state.display,
          sortKey: state.sortKey, sortDesc: state.sortDesc
        }));
      } catch (e) { /* per-viewer convenience only */ }
    }

    // The watchlist lives in this browser only (localStorage) — a personal
    // shortlist, not synced state. Storage can be unavailable (private
    // windows, blocked site data), so every touch is guarded and the page
    // works identically with nothing stored.
    var WATCH_KEY = "oklahoma-watchlist";
    function loadWatch() {
      try {
        return new Set(JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"));
      } catch (e) { return new Set(); }
    }
    function saveWatch() {
      try {
        localStorage.setItem(WATCH_KEY, JSON.stringify(Array.from(watch)));
      } catch (e) { /* per-viewer convenience only */ }
    }
    var watch = loadWatch();
    watch.forEach(function (t) { if (!rowByTicker[t]) watch.delete(t); });
    saveWatch();

    /* ----- metrics ----- */

    // One registry drives the sort menu, the card pill and the table
    // columns, so a figure means the same thing wherever it appears.
    // `value` returns null wherever the figure would not be honest: the
    // full-window metrics for a name with less than a year of bars, or
    // any metric whose window the name cannot fill. A null shows as a
    // dash and sinks in every sort, whichever direction.
    function fullOnly(field) {
      return function (r, cov) {
        return cov && cov.sufficient && cov[field] != null ? cov[field] : null;
      };
    }
    function anyWindow(field) {
      return function (r, cov) {
        return cov && cov[field] != null ? cov[field] : null;
      };
    }
    var METRICS = {
      cap: { label: "Market cap", short: "Cap", neutral: true,
        value: function (r) { return r.market_cap; }, fmt: money },
      ret12: { label: "12-mo return", short: "12-mo", explain: "ret12",
        value: fullOnly("window_return_pct"), fmt: pct },
      ret3: { label: "3-mo return", short: "3-mo", explain: "ret3",
        value: anyWindow("return_3m_pct"), fmt: pct },
      ret1: { label: "1-mo return", short: "1-mo", explain: "ret1",
        value: anyWindow("return_1m_pct"), fmt: pct },
      offhigh: { label: "Off 1y high", short: "Off high", explain: "offhigh",
        value: function (r, cov) {
          if (!cov || !cov.sufficient || cov.window_high == null ||
              cov.last_adj_close == null) return null;
          return (cov.last_adj_close / cov.window_high - 1) * 100;
        },
        fmt: function (v) { return v > -0.5 ? "at high" : v.toFixed(1) + "%"; },
        cls: function (v) { return v > -0.5 ? "up" : direction(v); } },
      vsmedian: { label: "Vs sector median", short: "Vs sector", explain: "vsmedian",
        value: function (r, cov) {
          var med = medianBySector[r.sector];
          if (med == null || !cov || !cov.sufficient ||
              cov.window_return_pct == null) return null;
          return cov.window_return_pct - med;
        },
        fmt: function (v) { return (v > 0 ? "+" : "") + v.toFixed(1) + " pts"; } },
      trend: { label: "Trend (log slope)", short: "Trend", explain: "trend",
        value: anyWindow("trend_ann_pct"),
        fmt: function (v) { return pct(v) + "/yr"; } },
      r2: { label: "R\u00b2 of trend", short: "R\u00b2", explain: "r2", neutral: true,
        value: anyWindow("trend_r2"), fmt: function (v) { return v.toFixed(2); } },
      quality: { label: "Quality momentum", short: "Quality", explain: "quality",
        value: anyWindow("quality_pct"),
        fmt: function (v) { return pct(v) + "/yr"; } },
      last: { label: "Last close", short: "Last", neutral: true,
        value: anyWindow("last_adj_close"),
        fmt: function (v) { return "$" + v.toLocaleString(); } }
    };
    var METRIC_ORDER = ["cap", "ret12", "ret3", "ret1", "offhigh", "vsmedian",
      "trend", "r2", "quality", "last"];
    var TABLE_COLUMNS = ["cap", "ret12", "ret3", "ret1", "offhigh", "vsmedian",
      "trend", "r2", "quality"];
    function metricValue(key, r) { return METRICS[key].value(r, coverage[r.ticker]); }
    function metricText(key, v) { return v == null ? "\u2014" : METRICS[key].fmt(v); }
    function metricClass(key, v) {
      var m = METRICS[key];
      if (v == null || m.neutral) return "";
      return m.cls ? m.cls(v) : direction(v);
    }

    function ordered(rows_) {
      var key = state.sortKey;
      var sign = state.sortDesc ? -1 : 1;
      var vals = {};
      rows_.forEach(function (r) { vals[r.ticker] = metricValue(key, r); });
      return rows_.slice().sort(function (a, b) {
        var ra = vals[a.ticker], rb = vals[b.ticker];
        if (ra == null && rb == null) return 0;
        if (ra == null) return 1;
        if (rb == null) return -1;
        return sign * (ra - rb) || a.rank - b.rank;
      });
    }

    // 503 rows is too many to build in one synchronous pass on a phone,
    // so the list paints in frame-sized chunks: the first screenful is
    // instant and the rest streams in. A newer paint cancels an older one.
    var paintToken = 0;
    var afterPaint = null;
    function paintInto(container, items, makeNode) {
      var token = ++paintToken;
      container.textContent = "";
      var i = 0;
      function step() {
        if (token !== paintToken) return;
        var frag = document.createDocumentFragment();
        for (var end = Math.min(i + 80, items.length); i < end; i++) {
          frag.appendChild(makeNode(items[i]));
        }
        container.appendChild(frag);
        if (i < items.length) {
          requestAnimationFrame(step);
        } else if (afterPaint) {
          // Chunked painting means a caller cannot touch late rows right
          // after renderList() returns; this runs once the last chunk lands.
          var hook = afterPaint;
          afterPaint = null;
          hook();
        }
      }
      step();
    }

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var groupBtn = document.getElementById("groupToggle");
    var tableWrap = document.getElementById("table-wrap");
    var gridHead = document.getElementById("grid-head");
    var gridBody = document.getElementById("grid-body");
    var sortSelect = document.getElementById("sortKey");
    var sortDirBtn = document.getElementById("sortDir");
    var displaySelect = document.getElementById("displayKey");
    var displayWrap = document.getElementById("display-wrap");
    var columnsBtn = document.getElementById("columnsHelp");

    function starMark() {
      var mark = document.createElement("span");
      mark.className = "star-mark";
      mark.textContent = " \u2605";
      mark.setAttribute("role", "img");
      mark.setAttribute("aria-label", "on watchlist");
      return mark;
    }
    // The ticker as both views show it: the symbol, a star if watched,
    // and the honest badge for a name short of a year's bars.
    function tickerSpan(r) {
      var cov = coverage[r.ticker];
      var tick = document.createElement("span");
      tick.className = "ticker";
      tick.textContent = r.ticker;
      if (watch.has(r.ticker)) tick.appendChild(starMark());
      if (cov && !cov.sufficient) {
        var warn = document.createElement("span");
        warn.className = "warn";
        warn.textContent = cov.trading_days + "d";
        warn.title = "Only " + cov.trading_days + " trading days of history";
        tick.appendChild(document.createTextNode(" "));
        tick.appendChild(warn);
      }
      return tick;
    }
    function syncStars(ticker) {
      var r = rowByTicker[ticker];
      if (!r) return;
      document.querySelectorAll(
        '[data-ticker="' + CSS.escape(ticker) + '"] .ticker'
      ).forEach(function (tick) {
        tick.replaceWith(tickerSpan(r));
      });
    }

    function chip(label, value, count, color) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (color) b.style.setProperty("--sector", color);
      if (color) {
        var dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.appendChild(document.createTextNode(label));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        renderFilters();
        renderList();
      });
      return b;
    }

    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(chip("All", null, rows.length, null));

      var wchip = document.createElement("button");
      wchip.type = "button";
      wchip.className = "chip";
      wchip.id = "watch-chip";
      wchip.setAttribute("aria-pressed", String(state.watchOnly));
      wchip.appendChild(document.createTextNode("\u2605 Watchlist"));
      var wn = document.createElement("span");
      wn.className = "n";
      wn.id = "watch-count";
      wn.textContent = watch.size;
      wchip.appendChild(wn);
      wchip.addEventListener("click", function () {
        state.watchOnly = !state.watchOnly;
        renderFilters();
        renderList();
      });
      filtersEl.appendChild(wchip);
      sectors.forEach(function (s) {
        filtersEl.appendChild(chip(s, s, sectorCounts[s], sectorColor(s)));
      });
    }

    function visible() {
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.watchOnly && !watch.has(r.ticker)) return false;
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    function detailList(r) {
      var dl = document.createElement("div");
      dl.className = "detail";
      var cov = coverage[r.ticker];

      // Identity in one quiet line; the numbers get the structure.
      var facts = document.createElement("div");
      facts.className = "fact-line";
      var bits = [r.sector, r.industry,
        money(r.market_cap) + " (" + ((r.market_cap / totalCap) * 100).toFixed(2) + "% of universe)"];
      if (r.share_classes && r.share_classes.length > 1) {
        bits.push("classes " + r.share_classes.join(" + "));
      }
      facts.textContent = bits.filter(Boolean).join(" \u00b7 ");
      dl.appendChild(facts);

      function statCell(key, label, value, cls, sub) {
        var cell = document.createElement("div");
        cell.className = "stat-cell";
        cell.appendChild(explainLabel(key, label));
        var v = document.createElement("span");
        v.className = "stat-val" + (cls ? " " + cls : "");
        v.textContent = value;
        cell.appendChild(v);
        if (sub) {
          var sb = document.createElement("span");
          sb.className = "stat-sub";
          sb.textContent = sub;
          cell.appendChild(sb);
        }
        return cell;
      }

      if (cov && cov.window_return_pct != null) {
        var grid = document.createElement("div");
        grid.className = "stat-grid";
        grid.appendChild(statCell(cov.sufficient ? "ret12" : null,
          cov.sufficient ? "12-mo return" : cov.window_trading_days + "-day return",
          pct(cov.window_return_pct), direction(cov.window_return_pct)));
        if (cov.return_3m_pct != null) {
          grid.appendChild(statCell("ret3", "3-mo return",
            pct(cov.return_3m_pct), direction(cov.return_3m_pct)));
        }
        if (cov.return_1m_pct != null) {
          grid.appendChild(statCell("ret1", "1-mo return",
            pct(cov.return_1m_pct), direction(cov.return_1m_pct)));
        }
        if (cov.window_high != null && cov.last_adj_close != null) {
          var offHigh = (cov.last_adj_close / cov.window_high - 1) * 100;
          grid.appendChild(statCell(cov.sufficient ? "offhigh" : null,
            cov.sufficient ? "Off 1y high" : "Off " + cov.window_trading_days + "-day high",
            offHigh > -0.5 ? "at high" : offHigh.toFixed(1) + "%",
            offHigh > -0.5 ? "up" : direction(offHigh)));
        }
        var med = medianBySector[r.sector];
        if (med != null && cov.sufficient) {
          var delta = cov.window_return_pct - med;
          grid.appendChild(statCell("vsmedian", "Vs sector",
            (delta > 0 ? "+" : "") + delta.toFixed(1) + " pts",
            direction(delta), "median " + pct(med)));
        }
        if (cov.last_adj_close != null) {
          grid.appendChild(statCell(null, "Last close",
            "$" + cov.last_adj_close.toLocaleString(), ""));
        }
        dl.appendChild(grid);
      }

      var cumSeries = cov && cov.cum_return_spark;
      if (cumSeries && cumSeries.length > 1) {
        var card = document.createElement("div");
        card.className = "trend-card";

        var head = document.createElement("div");
        head.className = "tc-head";
        var title = document.createElement("span");
        title.className = "tc-title";
        title.textContent = "Price path, " + cov.window_trading_days + " trading days";
        head.appendChild(title);
        card.appendChild(head);

        var hasFit = cov.fit_spark && cov.fit_spark.length > 1;
        if (hasFit) {
          var stats = document.createElement("div");
          stats.className = "tc-stats";
          function tcStat(key, label, value, cls) {
            var wrap = document.createElement("span");
            wrap.className = "tc-stat";
            wrap.appendChild(explainLabel(key, label));
            var v = document.createElement("span");
            v.className = "tc-val" + (cls ? " " + cls : "");
            v.textContent = value;
            wrap.appendChild(v);
            return wrap;
          }
          stats.appendChild(tcStat("trend", "Trend",
            pct(cov.trend_ann_pct) + "/yr", direction(cov.trend_ann_pct)));
          stats.appendChild(tcStat("r2", "R\u00b2", cov.trend_r2.toFixed(2)));
          stats.appendChild(tcStat("quality", "Quality",
            pct(cov.quality_pct) + "/yr", direction(cov.quality_pct)));
          card.appendChild(stats);

          var toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "fit-toggle";
          head.appendChild(toggle);
        }

        var chartHolder = document.createElement("div");
        chartHolder.className = "series";
        card.appendChild(chartHolder);
        function renderChart() {
          chartHolder.textContent = "";
          var stroke = getComputedStyle(document.documentElement)
            .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
          chartHolder.appendChild(spark(
            cumSeries, 300, 56, stroke, true, 0,
            hasFit && state.showTrend ? cov.fit_spark : null
          ));
          if (hasFit) {
            toggle.textContent = state.showTrend ? "Hide trend line" : "Show trend line";
            toggle.setAttribute("aria-pressed", String(state.showTrend));
          }
        }
        if (hasFit) {
          toggle.addEventListener("click", function () {
            state.showTrend = !state.showTrend;
            renderChart();
          });
        }
        renderChart();

        var axis = document.createElement("div");
        axis.className = "axis";
        var from = document.createElement("span");
        from.textContent = cov.window_start_date || cov.start_date;
        var to = document.createElement("span");
        to.textContent = cov.end_date;
        axis.appendChild(from);
        axis.appendChild(to);
        card.appendChild(axis);
        dl.appendChild(card);
      }

      var watchRow = document.createElement("div");
      watchRow.className = "watch-row";
      watchRow.style.marginTop = "0";
      var watchBtn = document.createElement("button");
      watchBtn.type = "button";
      watchBtn.className = "watch-btn";
      var watchCtx = document.createElement("span");
      watchCtx.className = "watch-ctx";
      function paintWatch() {
        var on = watch.has(r.ticker);
        watchBtn.textContent = on ? "\u2605 On watchlist" : "\u2606 Add to watchlist";
        watchBtn.setAttribute("aria-pressed", String(on));
        // Distinctness at a glance: what the shortlist already holds, and
        // how much of it sits in this same sector.
        var inSector = 0;
        watch.forEach(function (t) {
          if (t === r.ticker) return;
          var rec = rowByTicker[t];
          if (rec && rec.sector === r.sector) inSector++;
        });
        watchCtx.textContent = !watch.size
          ? ""
          : "Watching " + watch.size + (inSector
              ? " \u00b7 " + inSector + " already in " + r.sector
              : " \u00b7 none in " + r.sector);
      }
      watchBtn.addEventListener("click", function () {
        if (watch.has(r.ticker)) watch.delete(r.ticker);
        else watch.add(r.ticker);
        saveWatch();
        paintWatch();
        var count = document.getElementById("watch-count");
        if (count) count.textContent = watch.size;
        syncStars(r.ticker);
        // With the watchlist filter on, the list behind the sheet must
        // drop or keep this name; the sheet itself stays where it is.
        if (state.watchOnly) renderList();
      });
      paintWatch();
      watchRow.appendChild(watchBtn);
      watchRow.appendChild(watchCtx);
      dl.appendChild(watchRow);

      if (cov) {
        var meta = document.createElement("div");
        meta.className = "detail-meta";
        var bits = [];
        if (r.exchange) bits.push(r.exchange);
        bits.push(cov.trading_days + " trading days, " +
          cov.start_date + " \u2192 " + cov.end_date);
        if (cov.window_low != null) {
          bits.push("range $" + cov.window_low.toLocaleString() +
            "\u2013$" + cov.window_high.toLocaleString());
        }
        meta.textContent = bits.join(" \u00b7 ");
        dl.appendChild(meta);
      }
      return dl;
    }

    function rowItem(r) {
      var li = document.createElement("li");
      var color = sectorColor(r.sector);
      var cov = coverage[r.ticker];

      var button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.setAttribute("aria-haspopup", "dialog");
      button.style.setProperty("--sector", color);

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = r.rank;

      var main = document.createElement("span");
      main.className = "name-cell";
      var ticker = tickerSpan(r);

      var company = document.createElement("span");
      company.className = "company";
      var companyName = document.createElement("span");
      companyName.className = "company-name";
      companyName.textContent = r.name;
      var capSub = document.createElement("span");
      capSub.className = "cap-sub";
      capSub.textContent = money(r.market_cap);
      company.appendChild(companyName);
      company.appendChild(capSub);
      main.appendChild(ticker);
      main.appendChild(company);

      var cap = document.createElement("span");
      cap.className = "cap";
      if (cov && cov.cum_return_spark && cov.cum_return_spark.length > 1) {
        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        var mini = spark(cov.cum_return_spark, 54, 18, stroke, false);
        mini.setAttribute("class", "spark");
        cap.appendChild(mini);
      }
      var metric = document.createElement("span");
      metric.className = "metric";
      var shownValue = metricValue(state.display, r);
      var pill = document.createElement("span");
      pill.className = "pill " + metricClass(state.display, shownValue);
      pill.textContent = metricText(state.display, shownValue);
      var pillCap = document.createElement("span");
      pillCap.className = "pill-cap";
      pillCap.textContent = METRICS[state.display].short;
      metric.appendChild(pill);
      metric.appendChild(pillCap);
      cap.appendChild(metric);

      button.appendChild(rank);
      button.appendChild(main);
      button.appendChild(cap);
      button.addEventListener("click", function () { openDetail(r, button); });

      li.setAttribute("data-ticker", r.ticker);
      li.appendChild(button);
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sector-head";
      var collapsed = collapsedSectors.has(name);
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.setAttribute("data-sector", name);
      var chev = document.createElement("span");
      chev.className = "chev";
      chev.setAttribute("aria-hidden", "true");
      chev.textContent = collapsed ? "\u25b8" : "\u25be";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.cssText =
        "width:7px;height:7px;border-radius:50%;flex:none;background:" +
        sectorColor(name);
      btn.appendChild(chev);
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(name));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      btn.appendChild(n);
      btn.addEventListener("click", function () {
        if (collapsedSectors.has(name)) collapsedSectors.delete(name);
        else collapsedSectors.add(name);
        // The header re-renders in place; put keyboard focus back on it
        // once the (chunked) repaint has actually created it.
        afterPaint = function () {
          var again = listEl.querySelector(
            '.sector-head[data-sector="' + CSS.escape(name) + '"]'
          );
          if (again) again.focus();
        };
        renderList();
      });
      li.appendChild(btn);
      return li;
    }

    function emptyMessage() {
      return state.watchOnly && !watch.size
        ? "Your watchlist is empty. Open a name and tap \u2606 Add to watchlist."
        : state.watchOnly
          ? "No watchlist name matches. The \u2605 Watchlist filter is on."
          : "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
    }

    function renderList() {
      var isTable = state.view === "table";
      document.getElementById("watch-tools").hidden = !state.watchOnly;
      listEl.hidden = isTable;
      tableWrap.hidden = !isTable;
      groupBtn.hidden = isTable;
      displayWrap.hidden = isTable;
      columnsBtn.hidden = !isTable;
      var shown = ordered(visible());
      resultEl.textContent =
        shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";
      if (isTable) renderTable(shown);
      else renderCards(shown);
    }

    function renderTable(shown) {
      tableWrap.scrollTop = 0;
      if (!shown.length) {
        gridBody.textContent = "";
        var tr = document.createElement("tr");
        var td = document.createElement("td");
        td.className = "empty";
        td.colSpan = TABLE_COLUMNS.length + 2;
        td.textContent = emptyMessage();
        tr.appendChild(td);
        gridBody.appendChild(tr);
        return;
      }
      paintInto(gridBody, shown, tableRow);
    }

    function renderCards(shown) {
      listEl.textContent = "";
      if (!shown.length) {
        var li = document.createElement("li");
        li.className = "empty";
        li.textContent = emptyMessage();
        listEl.appendChild(li);
        return;
      }

      var items = [];
      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          items.push({ header: s, count: group.length });
          if (collapsedSectors.has(s)) return;
          group.forEach(function (r) { items.push({ row: r }); });
        });
      } else {
        shown.forEach(function (r) { items.push({ row: r }); });
      }
      paintInto(listEl, items, function (item) {
        return item.header
          ? sectorHeader(item.header, item.count)
          : rowItem(item.row);
      });
    }

    /* ----- table view ----- */

    function renderTableHead() {
      gridHead.textContent = "";
      var first = document.createElement("th");
      first.scope = "col";
      first.textContent = "Name";
      gridHead.appendChild(first);
      var sectorTh = document.createElement("th");
      sectorTh.scope = "col";
      sectorTh.textContent = "Sector";
      gridHead.appendChild(sectorTh);
      TABLE_COLUMNS.forEach(function (key) {
        var th = document.createElement("th");
        th.scope = "col";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "th-sort";
        b.setAttribute("data-sort", key);
        b.appendChild(document.createTextNode(METRICS[key].short));
        var arrow = document.createElement("span");
        arrow.className = "th-arrow";
        arrow.setAttribute("aria-hidden", "true");
        b.appendChild(arrow);
        th.appendChild(b);
        gridHead.appendChild(th);
      });
      paintTableSortState();
    }
    function paintTableSortState() {
      gridHead.querySelectorAll("th").forEach(function (th) {
        var b = th.querySelector(".th-sort");
        if (!b) return;
        var active = b.getAttribute("data-sort") === state.sortKey;
        if (active) th.setAttribute("aria-sort", state.sortDesc ? "descending" : "ascending");
        else th.removeAttribute("aria-sort");
        b.querySelector(".th-arrow").textContent =
          active ? (state.sortDesc ? " \u2193" : " \u2191") : "";
      });
    }
    gridHead.addEventListener("click", function (event) {
      var b = event.target.closest ? event.target.closest(".th-sort") : null;
      if (!b) return;
      var key = b.getAttribute("data-sort");
      setSort(key, key === state.sortKey ? !state.sortDesc : true);
    });

    function tableRow(r) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-ticker", r.ticker);

      var nameCell = document.createElement("td");
      var open = document.createElement("button");
      open.type = "button";
      open.className = "tcell";
      open.setAttribute("aria-haspopup", "dialog");
      open.appendChild(tickerSpan(r));
      var nm = document.createElement("span");
      nm.className = "tname";
      nm.textContent = r.name;
      open.appendChild(nm);
      nameCell.appendChild(open);
      tr.appendChild(nameCell);

      var sectorCell = document.createElement("td");
      sectorCell.className = "tsector";
      sectorCell.title = r.sector;
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = sectorColor(r.sector);
      sectorCell.appendChild(dot);
      sectorCell.appendChild(document.createTextNode(r.sector));
      tr.appendChild(sectorCell);

      TABLE_COLUMNS.forEach(function (key) {
        var td = document.createElement("td");
        var v = metricValue(key, r);
        td.className = metricClass(key, v);
        td.textContent = metricText(key, v);
        tr.appendChild(td);
      });
      // The whole row is the target; the button inside is the keyboard
      // path, and its click bubbles here rather than opening twice.
      tr.addEventListener("click", function () { openDetail(r, open); });
      return tr;
    }

    var searchTimer;
    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderList, 120);
    });

    document.getElementById("watch-export").addEventListener("click", function (event) {
      var text = Array.from(watch).sort().join(", ");
      var btn = event.target;
      function done(label) {
        btn.textContent = label;
        setTimeout(function () { btn.textContent = "Copy tickers"; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { done("Copied"); },
          function () { window.prompt("Copy your watchlist:", text); done("Copy tickers"); }
        );
      } else {
        window.prompt("Copy your watchlist:", text);
      }
    });

    document.getElementById("watch-import").addEventListener("click", function () {
      var input = window.prompt("Paste tickers (comma or space separated):", "");
      if (!input) return;
      var added = 0, unknown = [];
      input.toUpperCase().split(/[^A-Z0-9.\-]+/).forEach(function (t) {
        if (!t) return;
        if (rowByTicker[t]) {
          if (!watch.has(t)) { watch.add(t); added++; }
        } else {
          unknown.push(t);
        }
      });
      saveWatch();
      var count = document.getElementById("watch-count");
      if (count) count.textContent = watch.size;
      renderList();
      if (unknown.length) {
        window.alert("Added " + added + ". Not in the universe: " + unknown.join(", "));
      }
    });

    // One path for every sort control: the menu, the direction button
    // and the table headers all end here, so they can never disagree.
    function setSort(key, desc) {
      state.sortKey = key;
      state.sortDesc = desc;
      sortSelect.value = key;
      sortDirBtn.textContent = desc ? "\u2193" : "\u2191";
      sortDirBtn.setAttribute("aria-label",
        "Sort direction: " + (desc ? "descending" : "ascending"));
      paintTableSortState();
      savePrefs();
      renderList();
    }
    sortSelect.addEventListener("change", function (event) {
      setSort(event.target.value, state.sortDesc);
    });
    sortDirBtn.addEventListener("click", function () {
      setSort(state.sortKey, !state.sortDesc);
    });

    function setView(view) {
      state.view = view;
      document.querySelectorAll(".viewswitch button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === view));
      });
      savePrefs();
      renderList();
    }
    document.querySelectorAll(".viewswitch button").forEach(function (b) {
      b.addEventListener("click", function () { setView(b.getAttribute("data-view")); });
    });

    displaySelect.addEventListener("change", function (event) {
      state.display = event.target.value;
      savePrefs();
      renderList();
    });

    columnsBtn.addEventListener("click", function () { openColumns(columnsBtn); });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-pressed", String(state.grouped));
      renderList();
    });

    // ----- tap-to-explain -----
    // Every underlined label opens one shared sheet: a plain sentence and
    // the formula, instead of fine print scattered through the page.
    var EXPLAIN = {
      ret12: ["12-month return",
        "Total change in the adjusted close over the last 252 trading days — about one year of sessions. Adjusted closes fold in dividends and splits, so this is total return.",
        "close today \u00f7 first close of the 252-session window \u2212 1"],
      ret3: ["3-month return",
        "Total change in the adjusted close over the last 63 trading days — about one quarter. Fresh momentum, against the 12-month figure's longer memory.",
        "close today \u00f7 first close of the 63-session window \u2212 1"],
      ret1: ["1-month return",
        "Total change in the adjusted close over the last 21 trading days — about one month. The shortest lens: what the name did lately, before the quarter and the year have their say.",
        "close today \u00f7 first close of the 21-session window \u2212 1"],
      offhigh: ["Off 1-year high",
        "How far today's adjusted close sits below the highest close of the past year. Near zero means the name is pressing its high; a deep number means a drawdown.",
        "close today \u00f7 year's highest close \u2212 1"],
      vsmedian: ["Vs sector median",
        "This name's 12-month return minus the median 12-month return of its sector, in percentage points. Separates a genuine standout from a name merely riding a strong sector.",
        "name's 12m return \u2212 sector median 12m return"],
      trend: ["12-month log trend",
        "A straight line fitted to the logarithm of the daily adjusted closes over the past year. On a log scale, steady compounding is a straight line — so the slope reads as the steady growth rate the year implies, shown annualized. The dashed line on the chart is this fit.",
        "slope of best-fit line through ln(close) vs day, compounded over 252 days"],
      r2: ["R\u00b2",
        "How much of the year's path the straight trend line explains, from 0 to 1. Near 1: the name ground steadily along its trend. Near 0: the outcome came from swings the trend does not describe.",
        "1 \u2212 variance of residuals \u00f7 variance of ln(close)"],
      quality: ["Quality momentum",
        "The trend's growth rate damped by how reliable the trend was. A steep but chaotic year scores lower than a steady climb — the classic quality-adjusted momentum score.",
        "trend %/yr \u00d7 R\u00b2"],
      median: ["Median return",
        "The middle 12-month return among the sector's names — half did better, half worse. Resistant to one huge winner dragging the average.",
        "middle value of the sector's 12-month returns"],
      breadth: ["% of names up",
        "The share of the sector's names whose 12-month return is positive. The guard on the median: a sector can look healthy on three winners, and breadth says so.",
        "names with positive 12m return \u00f7 names in sector"]
    };

    // ----- sheets -----
    // Both bottom sheets (a name's detail, an explanation) share one set
    // of mechanics: focus moves in, Tab cycles inside, Esc or the
    // backdrop closes, and focus returns to whatever opened it. The
    // explanation can open on top of the detail; Esc peels the top one.
    var epPop = document.getElementById("explain-pop");
    var epBody = document.getElementById("ep-body");
    var epFormula = document.getElementById("ep-formula");
    var epList = document.getElementById("ep-list");
    var epOpener = null;
    var dpPop = document.getElementById("detail-pop");
    var dpBody = document.getElementById("dp-body");
    var dpOpener = null;

    function lockScroll() {
      document.documentElement.classList.toggle(
        "sheet-open", !epPop.hidden || !dpPop.hidden);
    }
    function focusablesIn(el) {
      return Array.prototype.filter.call(
        el.querySelectorAll("button, [href], select, input, [tabindex]:not([tabindex='-1'])"),
        function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function trapTab(event, card) {
      var items = focusablesIn(card);
      if (!items.length) { event.preventDefault(); return; }
      var first = items[0], last = items[items.length - 1];
      var current = document.activeElement;
      if (!card.contains(current)) { event.preventDefault(); first.focus(); }
      else if (event.shiftKey && current === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && current === last) { event.preventDefault(); first.focus(); }
    }
    function returnFocus(opener) {
      if (opener && document.body.contains(opener)) { opener.focus(); return; }
      // The opener was repainted away (a watchlist change re-rendered
      // the list); land on the view itself rather than nowhere.
      (state.view === "table" ? tableWrap : listEl).focus();
    }

    function openExplain(key, opener) {
      var entry = EXPLAIN[key];
      if (!entry) return;
      document.getElementById("ep-title").textContent = entry[0];
      epBody.textContent = entry[1];
      epFormula.textContent = entry[2];
      epBody.hidden = false;
      epFormula.hidden = false;
      epList.hidden = true;
      epOpener = opener;
      epPop.hidden = false;
      lockScroll();
      document.getElementById("ep-close").focus();
    }
    function openColumns(opener) {
      document.getElementById("ep-title").textContent = "What the columns mean";
      epBody.textContent = "Tap a column heading to sort by it; tap again to flip " +
        "the direction. A dash means the figure would need more history than " +
        "the name has, so it is left out rather than measured over less.";
      epBody.hidden = false;
      epFormula.hidden = true;
      epList.textContent = "";
      TABLE_COLUMNS.forEach(function (key) {
        var m = METRICS[key];
        var entry = m.explain && EXPLAIN[m.explain];
        var dt = document.createElement("dt");
        dt.textContent = m.label;
        var dd = document.createElement("dd");
        dd.textContent = entry ? entry[1]
          : "Shares outstanding times price, from the provider's quote.";
        if (entry) {
          var code = document.createElement("code");
          code.textContent = entry[2];
          dd.appendChild(code);
        }
        epList.appendChild(dt);
        epList.appendChild(dd);
      });
      epList.hidden = false;
      epOpener = opener;
      epPop.hidden = false;
      lockScroll();
      document.getElementById("ep-close").focus();
    }
    function closeExplain() {
      epPop.hidden = true;
      lockScroll();
      var back = epOpener;
      epOpener = null;
      returnFocus(back);
    }

    function openDetail(r, opener) {
      document.getElementById("dp-ticker").textContent = r.ticker;
      document.getElementById("dp-name").textContent = r.name;
      dpBody.textContent = "";
      dpBody.appendChild(detailList(r));
      dpOpener = opener;
      dpPop.hidden = false;
      dpPop.firstElementChild.scrollTop = 0;
      lockScroll();
      document.getElementById("dp-close").focus();
    }
    function closeDetail() {
      dpPop.hidden = true;
      dpBody.textContent = "";
      lockScroll();
      var back = dpOpener;
      dpOpener = null;
      returnFocus(back);
    }

    document.addEventListener("click", function (event) {
      var label = event.target.closest ? event.target.closest(".xl") : null;
      if (label) { openExplain(label.getAttribute("data-explain"), label); }
    });
    epPop.addEventListener("click", function (event) {
      if (event.target === epPop) closeExplain();
    });
    dpPop.addEventListener("click", function (event) {
      if (event.target === dpPop) closeDetail();
    });
    document.getElementById("ep-close").addEventListener("click", closeExplain);
    document.getElementById("dp-close").addEventListener("click", closeDetail);
    document.addEventListener("keydown", function (event) {
      var top = !epPop.hidden ? epPop : !dpPop.hidden ? dpPop : null;
      if (!top) return;
      if (event.key === "Escape") {
        event.preventDefault();
        if (top === epPop) closeExplain(); else closeDetail();
      } else if (event.key === "Tab") {
        trapTab(event, top.firstElementChild);
      }
    });

    function explainLabel(key, text) {
      // No key means no sheet applies (a short-history name whose label
      // already says its real window): a plain span, not a dead button.
      if (!key) {
        var s = document.createElement("span");
        s.className = "xl-static";
        s.textContent = text;
        return s;
      }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "xl";
      b.setAttribute("data-explain", key);
      b.textContent = text;
      return b;
    }

    METRIC_ORDER.forEach(function (key) {
      [sortSelect, displaySelect].forEach(function (sel) {
        var option = document.createElement("option");
        option.value = key;
        option.textContent = METRICS[key].label;
        sel.appendChild(option);
      });
    });
    loadPrefs();
    if (!hasHistory) state.display = "cap";
    displaySelect.value = state.display;
    sortSelect.value = state.sortKey;
    sortDirBtn.textContent = state.sortDesc ? "\u2193" : "\u2191";
    sortDirBtn.setAttribute("aria-label",
      "Sort direction: " + (state.sortDesc ? "descending" : "ascending"));
    document.querySelectorAll(".viewswitch button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === state.view));
    });
    renderTableHead();
    renderFilters();
    renderList();
  })();
</script>
</body>
</html>
