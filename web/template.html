<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oklahoma Universe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
  :root {
    --ground: #f3f5f4;
    --surface: #ffffff;
    --surface-sunk: #eef1f0;
    --ink: #101917;
    --muted: #5d6b68;
    --faint: #8a9895;
    --line: #dee5e3;
    --accent: #0c6b5f;
    --accent-soft: #e1efec;
    --up: #1a7f52;
    --down: #b4443c;
    --warn: #9a6a17;
    --shadow: 0 1px 2px rgba(16, 25, 23, .06), 0 8px 24px -16px rgba(16, 25, 23, .3);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0c1211;
      --surface: #141d1b;
      --surface-sunk: #101817;
      --ink: #e7eeec;
      --muted: #93a6a2;
      --faint: #6d807c;
      --line: #22302d;
      --accent: #48c6b0;
      --accent-soft: #16302c;
      --up: #4fbe86;
      --down: #e2796f;
      --warn: #d9a445;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0c1211;
    --surface: #141d1b;
    --surface-sunk: #101817;
    --ink: #e7eeec;
    --muted: #93a6a2;
    --faint: #6d807c;
    --line: #22302d;
    --accent: #48c6b0;
    --accent-soft: #16302c;
    --up: #4fbe86;
    --down: #e2796f;
    --warn: #d9a445;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 56px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 28px 0 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- summary ---------- */

  .summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat {
    background: var(--surface);
    padding: 12px 12px 13px;
  }
  .stat dt {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  .note {
    margin: 10px 2px 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }
  .note.stale {
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--warn);
  }
  .note b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    color: var(--ink);
  }

  /* ---------- price history ---------- */

  .spark {
    display: block;
    width: 54px;
    height: 18px;
    margin-top: 3px;
    margin-left: auto;
    overflow: visible;
  }

  .chg {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .warn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--warn);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  .detail .series {
    grid-column: 1 / -1;
    margin-top: 6px;
  }
  .detail .series svg {
    display: block;
    width: 100%;
    height: 56px;
    overflow: visible;
  }
  .detail .caption {
    margin-bottom: 5px;
  }
  .detail .caption span:first-child {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--muted);
  }
  .detail .axis {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    margin-top: 3px;
  }

  /* ---------- cross-section ---------- */

  .xs-head {
    display: grid;
    grid-template-columns: 1fr auto 72px;
    gap: 10px;
    padding: 0 12px 6px;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .xs-head span:nth-child(2) { text-align: right; }
  .xs-head span:nth-child(3) { text-align: right; }
  .xs {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .xs li {
    display: grid;
    grid-template-columns: 1fr auto 72px;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    font-size: 12.5px;
  }
  .xs li + li { border-top: 1px solid var(--line); }
  .xs .sector-name {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .xs .sector-name .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
  }
  .xs .med {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    text-align: right;
  }
  .breadth {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .breadth .track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .breadth .track i {
    display: block;
    height: 100%;
    background: var(--up);
    border-radius: 2px;
  }
  .breadth .pct {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
    width: 30px;
    text-align: right;
  }

  .xtreme {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 8px;
  }
  .xlabel {
    flex: none;
    width: 64px;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .xchips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .xchip {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink);
    cursor: pointer;
  }
  .xchip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- controls ---------- */

  .controls { margin-top: 18px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 12px;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { flex: none; color: var(--faint); }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 11px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
  }
  .chip .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .resultline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 18px 2px 8px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .resultline .linebuttons {
    display: inline-flex;
    gap: 14px;
  }
  .resultline button {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .resultline button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }

  .sector-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--surface-sunk);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sector-head .n {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;
  }
  .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .rank {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .ticker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .name-cell {
    min-width: 0;
  }
  .company {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cap {
    text-align: right;
  }
  .cap b {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .weight {
    display: block;
    margin-top: 4px;
    margin-left: auto;
    width: 46px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .weight i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--sector, var(--accent));
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
    flex: none;
  }

  .detail {
    padding: 0 14px 14px 52px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    font-size: 12.5px;
  }
  .detail dt { color: var(--faint); }
  .detail dd {
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  footer {
    margin-top: 22px;
    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;
  }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color .12s ease; }
  }
  @media (min-width: 480px) {
    h1 { font-size: 40px; }
    .company { font-size: 13px; }
  }
</style>

</head>
<body>
<script id="universe-data" type="application/json">__UNIVERSE_JSON__</script>
<script id="history-data" type="application/json">__HISTORY_JSON__</script>

<div class="shell">
  <header class="masthead">
    <p class="eyebrow">U.S. equity universe</p>
    <h1>Oklahoma</h1>
    <p id="subtitle"></p>
  </header>

  <dl class="summary">
    <div class="stat"><dt>Names</dt><dd id="stat-count">&mdash;</dd></div>
    <div class="stat"><dt>Market cap</dt><dd id="stat-cap">&mdash;</dd></div>
    <div class="stat"><dt>Sectors</dt><dd id="stat-sectors">&mdash;</dd></div>
    <div class="stat" id="stat-history-tile" hidden>
      <dt id="stat-history-label">History</dt><dd id="stat-history">&mdash;</dd>
    </div>
  </dl>
  <p class="note stale" id="stale-note" hidden></p>
  <p class="note" id="history-note" hidden></p>
  <p class="note" id="changes-note" hidden></p>

  <section id="cross" hidden aria-label="12-month cross-section">
    <div class="resultline"><span id="cross-title"></span></div>
    <div class="xs-head" aria-hidden="true">
      <span>Sector</span><span>Median return</span><span>% of names up</span>
    </div>
    <ul class="xs" id="xs-sectors"></ul>
    <div class="xtreme"><span class="xlabel">Leaders</span><span id="xs-leaders" class="xchips"></span></div>
    <div class="xtreme"><span class="xlabel">Laggards</span><span id="xs-laggards" class="xchips"></span></div>
  </section>

  <div class="controls">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"></circle>
        <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
      <input id="search" type="search" placeholder="Search ticker, company or sector" autocomplete="off" aria-label="Search the universe">
    </label>
    <div class="filters" id="filters" role="group" aria-label="Filter by sector"></div>
  </div>

  <div class="resultline">
    <span id="resultcount"></span>
    <span class="linebuttons">
      <button id="sortToggle" type="button">Sort: cap</button>
      <button id="groupToggle" type="button" aria-pressed="false">Group by sector</button>
    </span>
  </div>

  <ul class="list" id="list"></ul>

  <footer id="footer"></footer>
</div>

<script>
  (function () {
    "use strict";

    var universe = JSON.parse(document.getElementById("universe-data").textContent);
    var rows = universe.constituents || [];

    var history = JSON.parse(document.getElementById("history-data").textContent);
    var coverage = {};
    ((history && history.coverage) || []).forEach(function (entry) {
      coverage[entry.ticker] = entry;
    });
    var hasHistory = Boolean(history && history.coverage && history.coverage.length);

    var SECTOR_COLORS = {
      "Technology": "#3f8ecf",
      "Communication Services": "#7a6ed0",
      "Consumer Cyclical": "#d08a3f",
      "Consumer Defensive": "#a99a35",
      "Financial Services": "#2fa08a",
      "Healthcare": "#cf5f7a",
      "Energy": "#a5623c",
      "Industrials": "#6f8ba0",
      "Basic Materials": "#4fa04f",
      "Real Estate": "#c07ab0",
      "Utilities": "#c9a93c",
      "Unclassified": "#8a9895"
    };
    function sectorColor(name) {
      return SECTOR_COLORS[name] || "#8a9895";
    }

    function money(value) {
      if (value >= 1e12) return "$" + (value / 1e12).toFixed(2) + "T";
      if (value >= 1e9) return "$" + (value / 1e9).toFixed(0) + "B";
      if (value >= 1e6) return "$" + (value / 1e6).toFixed(0) + "M";
      return "$" + value.toLocaleString();
    }

    function pct(value) {
      if (value == null) return "—";
      return (value > 0 ? "+" : "") + value.toFixed(2) + "%";
    }

    function direction(value) {
      if (value == null) return "flat";
      if (value > 0.005) return "up";
      if (value < -0.005) return "down";
      return "flat";
    }

    var SVG = "http://www.w3.org/2000/svg";

    function sparkPoints(series, width, height, baseline) {
      var lo = Math.min.apply(null, series);
      var hi = Math.max.apply(null, series);
      if (baseline != null) {
        lo = Math.min(lo, baseline);
        hi = Math.max(hi, baseline);
      }
      var span = hi - lo || 1;
      var step = series.length > 1 ? width / (series.length - 1) : 0;
      var pts = series.map(function (value, i) {
        return [i * step, height - ((value - lo) / span) * height];
      });
      pts.baselineY = baseline == null
        ? height
        : height - ((baseline - lo) / span) * height;
      return pts;
    }

    function spark(series, width, height, stroke, withFill, baseline) {
      var svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      if (!series || series.length < 2) return svg;

      var pts = sparkPoints(series, width, height, baseline);
      var d = pts.map(function (p, i) {
        return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
      }).join(" ");
      var floor = pts.baselineY.toFixed(2);

      if (withFill) {
        var area = document.createElementNS(SVG, "path");
        area.setAttribute("fill", stroke);
        area.setAttribute("fill-opacity", "0.16");
        area.setAttribute("d", d + " L" + width + " " + floor + " L0 " + floor + " Z");
        svg.appendChild(area);
      }

      if (baseline != null) {
        var rule = document.createElementNS(SVG, "line");
        rule.setAttribute("x1", "0");
        rule.setAttribute("x2", String(width));
        rule.setAttribute("y1", floor);
        rule.setAttribute("y2", floor);
        rule.setAttribute("stroke-width", "1");
        rule.setAttribute("stroke-dasharray", "3 4");
        rule.style.stroke = "var(--faint)";
        rule.style.opacity = ".55";
        svg.appendChild(rule);
      }

      var line = document.createElementNS(SVG, "path");
      line.setAttribute("d", d);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke-width", "1.4");
      line.setAttribute("stroke", stroke);
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("stroke-linejoin", "round");
      svg.appendChild(line);

      // The endpoint is where the price actually is; mark it.
      var end = pts[pts.length - 1];
      var dot = document.createElementNS(SVG, "circle");
      dot.setAttribute("cx", end[0].toFixed(2));
      dot.setAttribute("cy", end[1].toFixed(2));
      dot.setAttribute("r", "1.7");
      dot.setAttribute("fill", stroke);
      svg.appendChild(dot);
      return svg;
    }

    function asOf(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    var totalCap = rows.reduce(function (sum, r) { return sum + r.market_cap; }, 0);
    var largestCap = rows.reduce(function (max, r) { return Math.max(max, r.market_cap); }, 0);

    var sectorCounts = {};
    rows.forEach(function (r) {
      sectorCounts[r.sector] = (sectorCounts[r.sector] || 0) + 1;
    });
    var sectors = Object.keys(sectorCounts).sort(function (a, b) {
      return sectorCounts[b] - sectorCounts[a] || a.localeCompare(b);
    });

    var sourceName = (universe.source && universe.source.index) || "U.S.-listed companies";
    document.getElementById("subtitle").textContent =
      universe.count + " " + sourceName + " constituents by market cap · as of " + asOf(universe.generated_at);
    document.getElementById("stat-count").textContent = universe.count;
    document.getElementById("stat-cap").textContent = money(totalCap);
    document.getElementById("stat-sectors").textContent = sectors.length;

    var ageDays = (Date.now() - new Date(universe.generated_at)) / 86400000;
    if (ageDays > 5) {
      var stale = document.getElementById("stale-note");
      stale.hidden = false;
      stale.textContent =
        "This data is " + Math.floor(ageDays) + " days old. The daily refresh " +
        "may be failing \u2014 check the repository's Actions tab.";
    }

    if (hasHistory) {
      var target = history.criteria.trading_days_target;
      document.getElementById("stat-history-tile").hidden = false;
      document.getElementById("stat-history-label").textContent = target + "d history";
      document.getElementById("stat-history").textContent =
        history.sufficient_count + "/" + history.count;

      var short = history.coverage.filter(function (e) { return !e.sufficient; });
      var note = document.getElementById("history-note");
      note.hidden = false;
      if (short.length) {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) + ". " +
          short.length + " name" + (short.length > 1 ? "s have" : " has") +
          " less than " + target + " trading days of history: " +
          short.map(function (e) {
            return "<b>" + e.ticker + "</b> (" + e.trading_days + "d)";
          }).join(", ") + ".";
      } else {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) +
          ". Every name covers at least " + target + " trading days.";
      }
    }

    var changes = (history && history.recent_changes) || [];
    if (changes.length) {
      var parts = [];
      changes.slice().reverse().forEach(function (event) {
        var bits = [];
        event.joined.forEach(function (r) { bits.push("+" + r.ticker); });
        event.left.forEach(function (r) { bits.push("\u2212" + r.ticker); });
        event.renamed.forEach(function (r) { bits.push(r.from_ticker + "\u2192" + r.to_ticker); });
        parts.push(asOf(event.observed_at) + ": <b>" + bits.join("</b>, <b>") + "</b>");
      });
      var changesNote = document.getElementById("changes-note");
      changesNote.hidden = false;
      changesNote.innerHTML = "Membership changes \u2014 " + parts.join(" \u00b7 ");
    }

    var cross = history && history.cross_section;
    if (cross) {
      document.getElementById("cross").hidden = false;
      document.getElementById("cross-title").textContent =
        "12-month cross-section \u00b7 " + cross.names_used + " names";

      var sectorList = document.getElementById("xs-sectors");
      cross.sectors.forEach(function (row) {
        var li = document.createElement("li");

        var name = document.createElement("span");
        name.className = "sector-name";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.cssText =
          "width:7px;height:7px;border-radius:50%;flex:none;background:" +
          sectorColor(row.sector);
        name.appendChild(dot);
        name.appendChild(document.createTextNode(row.sector));
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = row.count;
        name.appendChild(n);

        var med = document.createElement("span");
        med.className = "med " + direction(row.median_return_pct);
        med.textContent = pct(row.median_return_pct);

        var breadth = document.createElement("span");
        breadth.className = "breadth";
        breadth.title = row.breadth_pct + "% of names positive";
        var track = document.createElement("span");
        track.className = "track";
        var fill = document.createElement("i");
        fill.style.width = row.breadth_pct + "%";
        track.appendChild(fill);
        var pctEl = document.createElement("span");
        pctEl.className = "pct";
        pctEl.textContent = Math.round(row.breadth_pct) + "%";
        breadth.appendChild(track);
        breadth.appendChild(pctEl);

        li.appendChild(name);
        li.appendChild(med);
        li.appendChild(breadth);
        sectorList.appendChild(li);
      });

      function chipRow(container, names) {
        names.forEach(function (row) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "xchip";
          var tick = document.createElement("span");
          tick.textContent = row.ticker + " ";
          var value = document.createElement("span");
          value.className = direction(row.return_pct);
          value.textContent = pct(row.return_pct);
          chip.appendChild(tick);
          chip.appendChild(value);
          chip.addEventListener("click", function () {
            var input = document.getElementById("search");
            input.value = row.ticker;
            state.query = row.ticker;
            // The chip names one specific ticker; an active sector filter
            // would only hide it, so clear the filter with the chips' UI.
            state.sector = null;
            renderFilters();
            renderList();
            listEl.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          container.appendChild(chip);
        });
      }
      chipRow(document.getElementById("xs-leaders"), cross.leaders);
      chipRow(document.getElementById("xs-laggards"), cross.laggards);
    }

    var source = universe.source || {};
    document.getElementById("footer").innerHTML =
      "Data from " + (source.provider || "the configured provider") +
      ", <code>" + (source.endpoint || "") + "</code>. The universe mirrors current " +
      sourceName + " membership; <code>python -m oklahoma refresh</code> updates it." +
      (hasHistory
        ? " Prices are split- and dividend-adjusted closes; the page carries a thinned " +
          "series per name, the full history lives in <code>data/history/</code>."
        : "");

    /* ----- state ----- */

    var state = { query: "", sector: null, grouped: false, sort: "cap" };

    // The universe arrives ranked by market cap, so "cap" keeps the given
    // order. Return sorts use the 12-month figure; names without one
    // (too little history) always sink to the bottom.
    function ordered(rows_) {
      if (state.sort === "cap") return rows_;
      var sign = state.sort === "ret-asc" ? 1 : -1;
      return rows_.slice().sort(function (a, b) {
        var ca = coverage[a.ticker], cb = coverage[b.ticker];
        var ra = ca && ca.window_return_pct != null ? ca.window_return_pct : null;
        var rb = cb && cb.window_return_pct != null ? cb.window_return_pct : null;
        if (ra == null && rb == null) return 0;
        if (ra == null) return 1;
        if (rb == null) return -1;
        return sign * (ra - rb);
      });
    }
    var openRow = { ticker: null, li: null };

    function closeOpenRow() {
      if (openRow.li) {
        var detail = openRow.li.querySelector(".detail");
        if (detail) detail.remove();
        var btn = openRow.li.querySelector(".row");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
      openRow.ticker = null;
      openRow.li = null;
    }

    // 503 rows is too many to build in one synchronous pass on a phone,
    // so the list paints in frame-sized chunks: the first screenful is
    // instant and the rest streams in. A newer paint cancels an older one.
    var paintToken = 0;
    function paintList(items, makeNode) {
      var token = ++paintToken;
      listEl.textContent = "";
      var i = 0;
      function step() {
        if (token !== paintToken) return;
        var frag = document.createDocumentFragment();
        for (var end = Math.min(i + 80, items.length); i < end; i++) {
          frag.appendChild(makeNode(items[i]));
        }
        listEl.appendChild(frag);
        if (i < items.length) requestAnimationFrame(step);
      }
      step();
    }

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var groupBtn = document.getElementById("groupToggle");

    function chip(label, value, count, color) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (color) b.style.setProperty("--sector", color);
      if (color) {
        var dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.appendChild(document.createTextNode(label));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        renderFilters();
        renderList();
      });
      return b;
    }

    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(chip("All", null, rows.length, null));
      sectors.forEach(function (s) {
        filtersEl.appendChild(chip(s, s, sectorCounts[s], sectorColor(s)));
      });
    }

    function visible() {
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    function detailList(r) {
      var dl = document.createElement("dl");
      dl.className = "detail";
      var pairs = [
        ["Sector", r.sector],
        ["Industry", r.industry || "—"],
        ["Exchange", r.exchange || "—"],
        ["Market cap", "$" + r.market_cap.toLocaleString()],
        ["Share of universe", ((r.market_cap / totalCap) * 100).toFixed(2) + "%"]
      ];
      if (r.price != null) pairs.push(["Last price", "$" + r.price.toLocaleString()]);
      if (r.share_classes && r.share_classes.length > 1) {
        pairs.push(["Share classes", r.share_classes.join(", ")]);
      }

      var cov = coverage[r.ticker];
      if (cov) {
        pairs.push(["Trading days", cov.trading_days + (cov.sufficient ? "" : " — short")]);
        pairs.push(["Loaded", cov.start_date + " \u2192 " + cov.end_date]);
        if (cov.last_adj_close != null) {
          pairs.push(["Last adj. close", "$" + cov.last_adj_close.toLocaleString()]);
        }
        if (cov.window_return_pct != null) {
          pairs.push([
            cov.window_trading_days + "-day return",
            pct(cov.window_return_pct)
          ]);
        }
        if (cov.window_low != null) {
          pairs.push([
            "Adj. close range",
            "$" + cov.window_low.toLocaleString() + " – $" + cov.window_high.toLocaleString()
          ]);
        }
      }
      pairs.forEach(function (pair) {
        var dt = document.createElement("dt");
        dt.textContent = pair[0];
        var dd = document.createElement("dd");
        dd.textContent = pair[1];
        dl.appendChild(dt);
        dl.appendChild(dd);
      });

      var cumSeries = cov && cov.cum_return_spark;
      if (cumSeries && cumSeries.length > 1) {
        var wrap = document.createElement("div");
        wrap.className = "series";

        var caption = document.createElement("div");
        caption.className = "axis caption";
        var label = document.createElement("span");
        label.textContent = "Cumulative return, " + cov.window_trading_days + " trading days";
        var final_ = document.createElement("span");
        final_.className = direction(cov.window_return_pct);
        final_.textContent = pct(cov.window_return_pct);
        caption.appendChild(label);
        caption.appendChild(final_);
        wrap.appendChild(caption);

        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        wrap.appendChild(spark(cumSeries, 300, 56, stroke, true, 0));

        var axis = document.createElement("div");
        axis.className = "axis";
        var from = document.createElement("span");
        from.textContent = cov.window_start_date || cov.start_date;
        var to = document.createElement("span");
        to.textContent = cov.end_date;
        axis.appendChild(from);
        axis.appendChild(to);
        wrap.appendChild(axis);
        dl.appendChild(wrap);
      }
      return dl;
    }

    function rowItem(r) {
      var li = document.createElement("li");
      var color = sectorColor(r.sector);
      var cov = coverage[r.ticker];

      var button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.setAttribute("aria-expanded", "false");
      button.style.setProperty("--sector", color);

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = r.rank;

      var main = document.createElement("span");
      main.className = "name-cell";
      var ticker = document.createElement("span");
      ticker.className = "ticker";
      ticker.textContent = r.ticker;
      if (cov && cov.window_return_pct != null) {
        var chg = document.createElement("span");
        chg.className = "chg " + direction(cov.window_return_pct);
        chg.textContent = " " + pct(cov.window_return_pct);
        ticker.appendChild(chg);
      }
      if (cov && !cov.sufficient) {
        var warn = document.createElement("span");
        warn.className = "warn";
        warn.textContent = cov.trading_days + "d";
        warn.title = "Only " + cov.trading_days + " trading days of history";
        ticker.appendChild(document.createTextNode(" "));
        ticker.appendChild(warn);
      }

      var company = document.createElement("span");
      company.className = "company";
      company.textContent = r.name;
      main.appendChild(ticker);
      main.appendChild(company);

      var cap = document.createElement("span");
      cap.className = "cap";
      var capValue = document.createElement("b");
      capValue.textContent = money(r.market_cap);
      cap.appendChild(capValue);

      if (cov && cov.cum_return_spark && cov.cum_return_spark.length > 1) {
        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        var mini = spark(cov.cum_return_spark, 54, 18, stroke, false);
        mini.setAttribute("class", "spark");
        cap.appendChild(mini);
      } else {
        var bar = document.createElement("span");
        bar.className = "weight";
        var fill = document.createElement("i");
        fill.style.width = Math.max(4, (r.market_cap / largestCap) * 100) + "%";
        bar.appendChild(fill);
        cap.appendChild(bar);
      }

      button.appendChild(rank);
      button.appendChild(main);
      button.appendChild(cap);
      button.addEventListener("click", function () {
        var wasOpen = openRow.ticker === r.ticker;
        closeOpenRow();
        if (!wasOpen) {
          button.setAttribute("aria-expanded", "true");
          li.appendChild(detailList(r));
          openRow.ticker = r.ticker;
          openRow.li = li;
        }
      });

      li.appendChild(button);
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      li.className = "sector-head";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--sector", sectorColor(name));
      dot.style.width = "7px";
      dot.style.height = "7px";
      dot.style.borderRadius = "50%";
      dot.style.background = sectorColor(name);
      li.appendChild(dot);
      li.appendChild(document.createTextNode(name));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      li.appendChild(n);
      return li;
    }

    function renderList() {
      closeOpenRow();
      var shown = ordered(visible());
      listEl.textContent = "";
      resultEl.textContent =
        shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";

      if (!shown.length) {
        var li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
        listEl.appendChild(li);
        return;
      }

      var items = [];
      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          items.push({ header: s, count: group.length });
          group.forEach(function (r) { items.push({ row: r }); });
        });
      } else {
        shown.forEach(function (r) { items.push({ row: r }); });
      }
      paintList(items, function (item) {
        return item.header
          ? sectorHeader(item.header, item.count)
          : rowItem(item.row);
      });
    }

    var searchTimer;
    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderList, 120);
    });

    var SORT_STATES = [
      { key: "cap", label: "Sort: cap" },
      { key: "ret-desc", label: "Sort: return \u2193" },
      { key: "ret-asc", label: "Sort: return \u2191" }
    ];
    var sortBtn = document.getElementById("sortToggle");
    sortBtn.addEventListener("click", function () {
      var next =
        (SORT_STATES.findIndex(function (s_) { return s_.key === state.sort; }) + 1) %
        SORT_STATES.length;
      state.sort = SORT_STATES[next].key;
      sortBtn.textContent = SORT_STATES[next].label;
      renderList();
    });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-pressed", String(state.grouped));
      groupBtn.textContent = state.grouped ? "Sort by market cap" : "Group by sector";
      renderList();
    });

    renderFilters();
    renderList();
  })();
</script>
</body>
</html>
