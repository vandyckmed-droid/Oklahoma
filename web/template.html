      chipRow(document.getElementById("xs-leaders"), cross.leaders);
      chipRow(document.getElementById("xs-laggards"), cross.laggards);
    }

    /* ----- state ----- */

    var state = {
      query: "", sector: null, grouped: false,
      sortKey: "cap", sortDesc: true, watchOnly: false, showTrend: false,
      view: "cards", display: "ret12", tab: "universe"
    };
    var collapsedSectors = new Set();

    // View, shown figure and sort survive a reload on this device. They
    // are conveniences: an unreadable store just means the defaults.
    var PREFS_KEY = "oklahoma-prefs";
    function loadPrefs() {
      var p;
      try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}"); } catch (e) { return; }
      if (!p || typeof p !== "object") return;
      if (p.view === "table" || p.view === "cards") state.view = p.view;
      if (METRICS[p.display]) state.display = p.display;
      if (METRICS[p.sortKey]) state.sortKey = p.sortKey;
      if (typeof p.sortDesc === "boolean") state.sortDesc = p.sortDesc;
      if (TABS.indexOf(p.tab) !== -1) state.tab = p.tab;
      if (typeof p.grouped === "boolean") state.grouped = p.grouped;
      if (typeof p.showTrend === "boolean") state.showTrend = p.showTrend;
    }
    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify({
          view: state.view, display: state.display,
          sortKey: state.sortKey, sortDesc: state.sortDesc, tab: state.tab,
          grouped: state.grouped, showTrend: state.showTrend
        }));
      } catch (e) { /* per-viewer convenience only */ }
    }

    // The watchlist lives in this browser only (localStorage): a personal
    // shortlist, not synced state. Storage can be unavailable (private
    // windows, blocked site data), so every touch is guarded and the page
    // works identically with nothing stored.
    var WATCH_KEY = "oklahoma-watchlist";
    function loadWatch() {
      try {
        return new Set(JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"));
      } catch (e) { return new Set(); }
    }
    function saveWatch() {
      try {
        localStorage.setItem(WATCH_KEY, JSON.stringify(Array.from(watch)));
      } catch (e) { /* per-viewer convenience only */ }
    }
    var watch = loadWatch();
    watch.forEach(function (t) { if (!rowByTicker[t]) watch.delete(t); });
    saveWatch();

    /* ----- metrics ----- */

    // One registry drives the sort menu, the strip's figure and the table
    // columns, so a figure means the same thing wherever it appears.
    // `value` returns null wherever the figure would not be honest: the
    // full-window metrics for a name with less than a year of bars, or
    // any metric whose window the name cannot fill. A null shows as a
    // dash and sinks in every sort, whichever direction.
    function fullOnly(field) {
      return function (r, cov) {
        return cov && cov.sufficient && cov[field] != null ? cov[field] : null;
      };
    }
    function anyWindow(field) {
      return function (r, cov) {
        return cov && cov[field] != null ? cov[field] : null;
      };
    }
    var METRICS = {
      cap: { label: "Market cap", short: "Cap", explain: "cap",
        value: function (r) { return r.market_cap; }, fmt: money },
      ret12: { label: "12-mo return", short: "12-mo", explain: "ret12",
        value: fullOnly("window_return_pct"), fmt: pct, tfmt: pct1 },
      ret6: { label: "6-mo return", short: "6-mo", explain: "ret6",
        value: anyWindow("return_6m_pct"), fmt: pct, tfmt: pct1 },
      ret3: { label: "3-mo return", short: "3-mo", explain: "ret3",
        value: anyWindow("return_3m_pct"), fmt: pct, tfmt: pct1 },
      ret1: { label: "1-mo return", short: "1-mo", explain: "ret1",
        value: anyWindow("return_1m_pct"), fmt: pct, tfmt: pct1 },
      offhigh: { label: "Off 1y high", short: "Off high", explain: "offhigh",
        value: function (r, cov) {
          if (!cov || !cov.sufficient || cov.window_high == null ||
              cov.last_adj_close == null) return null;
          return (cov.last_adj_close / cov.window_high - 1) * 100;
        },
        fmt: function (v) { return v > -0.5 ? "at high" : signed(v, 1, "%"); } },
      vsmedian: { label: "Vs sector median", short: "Vs sector", explain: "vsmedian",
        value: function (r, cov) {
          var med = medianBySector[r.sector];
          if (med == null || !cov || !cov.sufficient ||
              cov.window_return_pct == null) return null;
          return cov.window_return_pct - med;
        },
        fmt: function (v) { return signed(v, 1, " pts"); },
        head: "Vs sector pts",
        tfmt: function (v) { return signed(v, 1); } },
      trend: { label: "Trend (log slope)", short: "Trend", explain: "trend",
        value: anyWindow("trend_ann_pct"), head: "Trend %/yr",
        fmt: function (v) { return signed(v, 2, "%/yr"); }, tfmt: pct1 },
      r2: { label: "R² of trend", short: "R²", explain: "r2",
        value: anyWindow("trend_r2"), fmt: function (v) { return v.toFixed(2); } },
      quality: { label: "Quality momentum", short: "Quality", explain: "quality",
        value: anyWindow("quality_pct"), head: "Quality %/yr",
        fmt: function (v) { return signed(v, 2, "%/yr"); }, tfmt: pct1 },
      last: { label: "Last close", short: "Last",
        value: anyWindow("last_adj_close"),
        fmt: function (v) { return "$" + v.toLocaleString(); } }
    };
    var METRIC_ORDER = ["cap", "ret12", "ret6", "ret3", "ret1", "offhigh", "vsmedian",
      "trend", "r2", "quality", "last"];
    var TABLE_COLUMNS = ["cap", "ret12", "ret6", "ret3", "ret1", "offhigh", "vsmedian",
      "trend", "r2", "quality"];
    function metricValue(key, r) { return METRICS[key].value(r, coverage[r.ticker]); }
    // `dense` picks the table's one-decimal, suffix-free form where a
    // metric defines one; the header carries the unit there.
    function metricText(key, v, dense) {
      if (v == null) return "—";
      var m = METRICS[key];
      return dense && m.tfmt ? m.tfmt(v) : m.fmt(v);
    }

    function ordered(rows_) {
      var key = state.sortKey;
      var sign = state.sortDesc ? -1 : 1;
      var vals = {};
      rows_.forEach(function (r) { vals[r.ticker] = metricValue(key, r); });
      return rows_.slice().sort(function (a, b) {
        var ra = vals[a.ticker], rb = vals[b.ticker];
        // Names without an honest figure sink together, in rank order,
        // so the dash block is deterministic here rather than by luck.
        if (ra == null && rb == null) return a.rank - b.rank;
        if (ra == null) return 1;
        if (rb == null) return -1;
        return sign * (ra - rb) || a.rank - b.rank;
      });
    }

    // 503 rows is too many to build in one synchronous pass on a phone,
    // so the list paints in frame-sized chunks: the first screenful is
    // instant and the rest streams in. A newer paint cancels an older one.
    var paintToken = 0;
    var afterPaint = null;
    function paintInto(container, items, makeNode) {
      var token = ++paintToken;
      container.textContent = "";
      var i = 0;
      function step() {
        if (token !== paintToken) return;
        var frag = document.createDocumentFragment();
        for (var end = Math.min(i + 60, items.length); i < end; i++) {
          frag.appendChild(makeNode(items[i]));
        }
        container.appendChild(frag);
        if (i < items.length) {
          requestAnimationFrame(step);
        } else if (afterPaint) {
          var hook = afterPaint;
          afterPaint = null;
          hook();
        }
      }
      step();
    }

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var listCal = document.getElementById("listcal");
    var groupBtn = document.getElementById("groupToggle");
    var tableWrap = document.getElementById("table-wrap");
    var gridHead = document.getElementById("grid-head");
    var gridBody = document.getElementById("grid-body");
    var sortSelect = document.getElementById("sortKey");
    var sortDirBtn = document.getElementById("sortDir");
    var displaySelect = document.getElementById("displayKey");
    var displayRow = document.getElementById("display-row");
    var groupRow = document.getElementById("group-row");
    var columnsBtn = document.getElementById("columnsHelp");
    var watchMix = document.getElementById("watch-mix");

    /* ----- tabs ----- */

    var TABS = ["universe", "sectors", "watch", "settings"];
    var listing = document.getElementById("listing");
    function setTab(tab) {
      if (TABS.indexOf(tab) === -1) tab = "universe";
      state.tab = tab;
      state.watchOnly = tab === "watch";
      TABS.forEach(function (name) {
        var on = name === tab;
        document.getElementById("tab-" + name).hidden = !on;
        var btn = document.getElementById("tabbtn-" + name);
        btn.setAttribute("aria-selected", String(on));
        btn.tabIndex = on ? 0 : -1;
      });
      // One listing serves two tabs: it moves under whichever is open,
      // so the Watchlist is the same strips or table as the Universe.
      if (tab === "universe" || tab === "watch") {
        var slot = document.getElementById(tab === "watch" ? "watch-slot" : "universe-slot");
        if (listing.parentNode !== slot) slot.appendChild(listing);
        renderList();
      }
      if (tab === "watch") paintWatchMix();
      savePrefs();
      if (state.view === "table" && !tableWrap.hidden) {
        tableWrap.scrollIntoView({ block: "start" });
      } else {
        window.scrollTo(0, 0);
      }
    }
    var tabbar = document.getElementById("tabbar");
    tabbar.addEventListener("click", function (event) {
      var b = event.target.closest ? event.target.closest("[data-tab]") : null;
      if (b) setTab(b.getAttribute("data-tab"));
    });
    tabbar.addEventListener("keydown", function (event) {
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      event.preventDefault();
      var step = event.key === "ArrowRight" ? 1 : TABS.length - 1;
      var next = TABS[(TABS.indexOf(state.tab) + step) % TABS.length];
      setTab(next);
      document.getElementById("tabbtn-" + next).focus();
    });
    function paintWatchCount() {
      document.querySelectorAll(".watch-n").forEach(function (elx) {
        if (elx.id === "cross-title") return;
        elx.textContent = elx.classList.contains("tab-badge") ? watch.size : watch.size + " names";
        if (elx.classList.contains("tab-badge")) elx.hidden = !watch.size;
      });
    }
    // The shortlist's mix by sector: the same count the detail sheet
    // reasons about, here as one line the whole list can be read against.
    function paintWatchMix() {
      watchMix.textContent = "";
      watchMix.hidden = !watch.size;
      if (!watch.size) return;
      var counts = {};
      watch.forEach(function (t) {
        var r = rowByTicker[t];
        if (r) counts[r.sector] = (counts[r.sector] || 0) + 1;
      });
      Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); })
        .forEach(function (s) {
          var item = el("span", null);
          item.appendChild(el("span", "code", sectorCode(s)));
          item.appendChild(document.createTextNode(" " + counts[s]));
          item.title = s;
          watchMix.appendChild(item);
        });
    }

    function starMark() {
      var mark = icon("i-star", "star-mark");
      mark.setAttribute("role", "img");
      mark.setAttribute("aria-label", "on watchlist");
      mark.removeAttribute("aria-hidden");
      return mark;
    }
    // The ticker as both views show it: the symbol, the pencil mark if
    // watched, and the honest badge for a name short of a year's bars.
    function tickerSpan(r) {
      var cov = coverage[r.ticker];
      var tick = el("span", "ticker", r.ticker);
      if (watch.has(r.ticker)) tick.appendChild(starMark());
      if (cov && !cov.sufficient) {
        var warn = el("span", "warn", cov.trading_days + "d");
        warn.title = "Only " + cov.trading_days + " trading days of history";
        tick.appendChild(warn);
      }
      return tick;
    }
    function syncStars(ticker) {
      var r = rowByTicker[ticker];
      if (!r) return;
      document.querySelectorAll(
        '[data-ticker="' + CSS.escape(ticker) + '"] .ticker'
      ).forEach(function (tick) {
        tick.replaceWith(tickerSpan(r));
      });
    }

    /* ----- lead selector ----- */

    function leadButton(code, name, value, count) {
      var b = el("button", "lead-btn");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (code) b.appendChild(el("span", "code", code));
      b.appendChild(el("span", "lname", name));
      b.appendChild(el("span", "n", count));
      if (value) b.title = name;
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        renderFilters();
        renderList();
      });
      return b;
    }
    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(leadButton(null, "All", null, rows.length));
      sectors.forEach(function (s) {
        filtersEl.appendChild(leadButton(sectorCode(s), s, s, sectorCounts[s]));
      });
    }

    function visible() {
      // The Watchlist tab shows the whole shortlist; search and sector
      // leads belong to the Universe tab and do not reach into it.
      if (state.watchOnly) {
        return rows.filter(function (r) { return watch.has(r.ticker); });
      }
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    /* ----- the detail sheet: one name's full strip ----- */

    function bandCell(key, label, value, sub, missing) {
      var cell = el("div", "band-cell");
      cell.appendChild(explainLabel(key, label));
      cell.appendChild(el("span", "val" + (missing ? " none" : ""), value));
      if (sub) cell.appendChild(el("span", "sub", sub));
      return cell;
    }

    function detailList(r) {
      var dl = el("div", "detail");
      var cov = coverage[r.ticker];

      var bits = [sectorCode(r.sector) + " " + r.sector, r.industry,
        money(r.market_cap) + " (" + ((r.market_cap / totalCap) * 100).toFixed(2) + "% of universe)"];
      if (r.share_classes && r.share_classes.length > 1) {
        bits.push("classes " + r.share_classes.join(" + "));
      }
      dl.appendChild(el("div", "fact-line", bits.filter(Boolean).join(" · ")));

      if (cov && cov.window_return_pct != null) {
        // The return windows as one banded strip: every window has its
        // cell, and a window the name cannot fill says so in place.
        var windows = el("div", "band-row four");
        var w1 = cov.return_1m_pct, w3 = cov.return_3m_pct, w6 = cov.return_6m_pct;
        windows.appendChild(bandCell("ret1", "1 mo", pct(w1), "21 days", w1 == null));
        windows.appendChild(bandCell("ret3", "3 mo", pct(w3), "63 days", w3 == null));
        windows.appendChild(bandCell("ret6", "6 mo", pct(w6), "126 days", w6 == null));
        windows.appendChild(bandCell(cov.sufficient ? "ret12" : null,
          cov.sufficient ? "12 mo" : cov.window_trading_days + " days",
          pct(cov.window_return_pct),
          cov.sufficient ? target + " days" : "short history"));
        dl.appendChild(windows);

        var position = el("div", "band-row two");
        if (cov.window_high != null && cov.last_adj_close != null) {
          var offHigh = (cov.last_adj_close / cov.window_high - 1) * 100;
          position.appendChild(bandCell(cov.sufficient ? "offhigh" : null,
            cov.sufficient ? "Off 1y high" : "Off " + cov.window_trading_days + "-day high",
            offHigh > -0.5 ? "at high" : signed(offHigh, 1, "%"),
            "high $" + cov.window_high.toLocaleString()));
        }
        var med = medianBySector[r.sector];
        if (med != null && cov.sufficient) {
          position.appendChild(bandCell("vsmedian", "Vs sector",
            signed(cov.window_return_pct - med, 1, " pts"),
            sectorCode(r.sector) + " median " + pct(med)));
        } else {
          position.appendChild(bandCell(null, "Vs sector", "—", "needs a full window", true));
        }
        dl.appendChild(position);
      }

      var cumSeries = cov && cov.cum_return_spark;
      if (cumSeries && cumSeries.length > 1) {
        var hasFit = cov.fit_spark && cov.fit_spark.length > 1;
        var rhythm = el("div", "rhythm");
        var head = el("div", "rhythm-head");
        var title = el("span", "rhythm-title");
        head.appendChild(title);
        var toggle = null;
        if (hasFit) {
          toggle = el("button", "fit-toggle");
          toggle.type = "button";
        }
        if (toggle) head.appendChild(toggle);
        rhythm.appendChild(head);

        var holder = el("div", "series");
        rhythm.appendChild(holder);
        function renderChart(animate) {
          holder.textContent = "";
          var strip = trace(cumSeries, 12, 4, {
            overlay: hasFit && state.showTrend ? cov.fit_spark : null,
            dashed: !cov.sufficient
          });
          holder.appendChild(strip);
          title.textContent = cov.window_trading_days + " sessions · 1 box = 21 sessions × " + strip.gain + "%";
          if (animate) strip.draw();
          if (toggle) {
            toggle.textContent = "";
            toggle.appendChild(el("span", "swatch"));
            toggle.appendChild(document.createTextNode(
              state.showTrend ? "Trend line shown" : "Show trend line"));
            toggle.setAttribute("aria-pressed", String(state.showTrend));
          }
        }
        if (toggle) {
          toggle.addEventListener("click", function () {
            state.showTrend = !state.showTrend;
            savePrefs();
            renderChart(false);
          });
        }
        renderChart(true);

        var axis = el("div", "axis");
        axis.appendChild(el("span", null, cov.window_start_date || cov.start_date));
        axis.appendChild(el("span", null, "0% at start"));
        axis.appendChild(el("span", null, cov.end_date));
        rhythm.appendChild(axis);
        dl.appendChild(rhythm);

        if (hasFit) {
          var fitRow = el("div", "band-row three");
          fitRow.appendChild(bandCell("trend", "Trend", signed(cov.trend_ann_pct, 2, "%"), "per year"));
          fitRow.appendChild(bandCell("r2", "R²", cov.trend_r2.toFixed(2), "0 to 1"));
          fitRow.appendChild(bandCell("quality", "Quality", signed(cov.quality_pct, 2, "%"), "trend × R²"));
          dl.appendChild(fitRow);
        }
      }

      var watchRow = el("div", "watch-row");
      var watchBtn = el("button", "watch-btn");
      watchBtn.type = "button";
      var watchCtx = el("span", "watch-ctx");
      function paintWatch() {
        var on = watch.has(r.ticker);
        watchBtn.textContent = "";
        watchBtn.appendChild(icon(on ? "i-star" : "i-star-o"));
        watchBtn.appendChild(document.createTextNode(on ? "On the watchlist" : "Mark for the watchlist"));
        watchBtn.setAttribute("aria-pressed", String(on));
        var inSector = 0;
        watch.forEach(function (t) {
          if (t === r.ticker) return;
          var rec = rowByTicker[t];
          if (rec && rec.sector === r.sector) inSector++;
        });
        watchCtx.textContent = !watch.size
          ? ""
          : "Watching " + watch.size + (inSector
              ? " · " + inSector + " already in " + r.sector
              : " · none in " + r.sector);
        var dpTick = document.getElementById("dp-ticker");
        var old = dpTick.querySelector(".star-mark");
        if (old) old.remove();
        if (on) dpTick.appendChild(starMark());
      }
      watchBtn.addEventListener("click", function () {
        if (watch.has(r.ticker)) watch.delete(r.ticker);
        else watch.add(r.ticker);
        saveWatch();
        paintWatch();
        paintWatchCount();
        paintWatchMix();
        syncStars(r.ticker);
        if (state.watchOnly) renderList();
      });
      paintWatch();
      watchRow.appendChild(watchBtn);
      watchRow.appendChild(watchCtx);
      dl.appendChild(watchRow);

      if (cov) {
        var meta = [];
        if (r.exchange) meta.push(r.exchange);
        meta.push(cov.trading_days + " trading days, " + cov.start_date + " → " + cov.end_date);
        if (cov.window_low != null) {
          meta.push("range $" + cov.window_low.toLocaleString() + "–$" + cov.window_high.toLocaleString());
        }
        if (cov.last_adj_close != null) {
          meta.push("last adj. close $" + cov.last_adj_close.toLocaleString());
        }
        dl.appendChild(el("div", "detail-meta", meta.join(" · ")));
      }
      return dl;
    }

    /* ----- strips ----- */

    function rowItem(r) {
      var li = document.createElement("li");
      var cov = coverage[r.ticker];

      var button = el("button", "strip");
      button.type = "button";
      button.setAttribute("aria-haspopup", "dialog");

      button.appendChild(el("span", "rank", r.rank));

      var main = el("span", "name-cell");
      main.appendChild(tickerSpan(r));
      var company = el("span", "company");
      company.appendChild(el("span", "company-name", r.name));
      company.appendChild(el("span", "cap-sub", money(r.market_cap)));
      main.appendChild(company);
      button.appendChild(main);

      if (cov && cov.cum_return_spark && cov.cum_return_spark.length > 1) {
        button.appendChild(trace(cov.cum_return_spark, 6, 2, { dashed: !cov.sufficient }));
      } else {
        button.appendChild(el("span", "trace-empty"));
      }

      var figure = el("span", "figure");
      var v = metricValue(state.display, r);
      figure.appendChild(el("span", "val" + (v == null ? " none" : ""), metricText(state.display, v)));
      figure.appendChild(el("span", "lab", METRICS[state.display].short));
      button.appendChild(figure);

      button.addEventListener("click", function () { openDetail(r, button); });
      li.setAttribute("data-ticker", r.ticker);
      li.appendChild(button);
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      var btn = el("button", "lead-head");
      btn.type = "button";
      var collapsed = collapsedSectors.has(name);
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.setAttribute("data-sector", name);
      btn.appendChild(icon("i-chev", "chev"));
      btn.appendChild(el("span", "code", sectorCode(name)));
      btn.appendChild(el("span", "lname", name));
      btn.appendChild(el("span", "n", count + " names"));
      btn.addEventListener("click", function () {
        if (collapsedSectors.has(name)) collapsedSectors.delete(name);
        else collapsedSectors.add(name);
        afterPaint = function () {
          var again = listEl.querySelector(
            '.lead-head[data-sector="' + CSS.escape(name) + '"]'
          );
          if (again) again.focus();
        };
        renderList();
      });
      li.appendChild(btn);
      return li;
    }

    function emptyMessage() {
      return state.watchOnly && !watch.size
        ? "Your watchlist is empty. Open a name and mark it for the watchlist."
        : state.watchOnly
          ? "No watchlist name matches."
          : "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
    }

    function renderList() {
      var isTable = state.view === "table";
      listEl.hidden = isTable;
      tableWrap.hidden = !isTable;
      var shown = ordered(visible());
      resultEl.textContent = state.watchOnly
        ? shown.length + " on your watchlist"
        : shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";
      listCal.hidden = isTable || !hasHistory;
      listCal.textContent = "1 box = 2 mo × gain";
      if (isTable) renderTable(shown);
      else renderCards(shown);
    }

    function renderTable(shown) {
      tableWrap.scrollTop = 0;
      if (!shown.length) {
        gridBody.textContent = "";
        var tr = document.createElement("tr");
        var td = el("td", "empty", emptyMessage());
        td.colSpan = TABLE_COLUMNS.length + 2;
        tr.appendChild(td);
        gridBody.appendChild(tr);
        return;
      }
      paintInto(gridBody, shown, tableRow);
    }

    function renderCards(shown) {
      listEl.textContent = "";
      if (!shown.length) {
        listEl.appendChild(el("li", "empty", emptyMessage()));
        return;
      }
      var items = [];
      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          items.push({ header: s, count: group.length });
          if (collapsedSectors.has(s)) return;
          group.forEach(function (r) { items.push({ row: r }); });
        });
      } else {
        shown.forEach(function (r) { items.push({ row: r }); });
      }
      paintInto(listEl, items, function (item) {
        return item.header
          ? sectorHeader(item.header, item.count)
          : rowItem(item.row);
      });
    }

    /* ----- table view ----- */

    function renderTableHead() {
      gridHead.textContent = "";
      var first = document.createElement("th");
      first.scope = "col";
      first.textContent = "Ticker";
      gridHead.appendChild(first);
      var sectorTh = document.createElement("th");
      sectorTh.scope = "col";
      sectorTh.textContent = "Lead";
      gridHead.appendChild(sectorTh);
      TABLE_COLUMNS.forEach(function (key) {
        var th = document.createElement("th");
        th.scope = "col";
        var b = el("button", "th-sort");
        b.type = "button";
        b.setAttribute("data-sort", key);
        b.appendChild(document.createTextNode(METRICS[key].head || METRICS[key].short));
        b.appendChild(icon("i-arrow", "th-arrow"));
        th.appendChild(b);
        gridHead.appendChild(th);
      });
      paintTableSortState();
    }
    function paintTableSortState() {
      gridHead.querySelectorAll("th").forEach(function (th) {
        var b = th.querySelector(".th-sort");
        if (!b) return;
        var active = b.getAttribute("data-sort") === state.sortKey;
        if (active) th.setAttribute("aria-sort", state.sortDesc ? "descending" : "ascending");
        else th.removeAttribute("aria-sort");
        var arrow = b.querySelector(".th-arrow");
        arrow.style.visibility = active ? "visible" : "hidden";
        arrow.style.transform = active && !state.sortDesc ? "rotate(180deg)" : "";
      });
    }
    gridHead.addEventListener("click", function (event) {
      var b = event.target.closest ? event.target.closest(".th-sort") : null;
      if (!b) return;
      var key = b.getAttribute("data-sort");
      setSort(key, key === state.sortKey ? !state.sortDesc : true);
    });

    function tableRow(r) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-ticker", r.ticker);

      var nameCell = document.createElement("td");
      var open = el("button", "tcell");
      open.type = "button";
      open.setAttribute("aria-haspopup", "dialog");
      open.appendChild(tickerSpan(r));
      nameCell.appendChild(open);
      tr.appendChild(nameCell);

      var sectorCell = el("td", "tsector");
      var code = document.createElement("abbr");
      code.title = r.sector;
      code.setAttribute("aria-label", r.sector);
      code.textContent = sectorCode(r.sector);
      sectorCell.appendChild(code);
      tr.appendChild(sectorCell);

      TABLE_COLUMNS.forEach(function (key) {
        var v = metricValue(key, r);
        tr.appendChild(el("td", v == null ? "none" : "", metricText(key, v, true)));
      });
      tr.addEventListener("click", function () { openDetail(r, open); });
      return tr;
    }

    var searchTimer;
    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderList, 120);
    });

    document.getElementById("watch-export").addEventListener("click", function (event) {
      var text = Array.from(watch).sort().join(", ");
      var btn = event.currentTarget;
      function done(label) {
        btn.textContent = label;
        setTimeout(function () { btn.textContent = "Copy tickers"; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { done("Copied"); },
          function () { window.prompt("Copy your watchlist:", text); done("Copy tickers"); }
        );
      } else {
        window.prompt("Copy your watchlist:", text);
      }
    });

    document.getElementById("watch-import").addEventListener("click", function () {
      var input = window.prompt("Paste tickers (comma or space separated):", "");
      if (!input) return;
      var added = 0, unknown = [];
      input.toUpperCase().split(/[^A-Z0-9.\-]+/).forEach(function (t) {
        if (!t) return;
        if (rowByTicker[t]) {
          if (!watch.has(t)) { watch.add(t); added++; }
        } else {
          unknown.push(t);
        }
      });
      saveWatch();
      paintWatchCount();
      paintWatchMix();
      renderList();
      if (unknown.length) {
        window.alert("Added " + added + ". Not in the universe: " + unknown.join(", "));
      }
    });

    // One path for every sort control: the menu, the direction button
    // and the table headers all end here, so they can never disagree.
    function setSort(key, desc) {
      state.sortKey = key;
      state.sortDesc = desc;
      sortSelect.value = key;
      sortDirBtn.firstElementChild.style.transform = desc ? "" : "rotate(180deg)";
      sortDirBtn.setAttribute("aria-label",
        "Sort direction: " + (desc ? "descending" : "ascending"));
      paintTableSortState();
      savePrefs();
      renderList();
    }
    sortSelect.addEventListener("change", function (event) {
      setSort(event.target.value, state.sortDesc);
    });
    sortDirBtn.addEventListener("click", function () {
      setSort(state.sortKey, !state.sortDesc);
    });

    function paintSettingsRows() {
      var isTable = state.view === "table";
      displayRow.hidden = isTable;
      groupRow.hidden = isTable;
    }
    function setView(view) {
      state.view = view;
      document.querySelectorAll(".seg button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === view));
      });
      paintSettingsRows();
      savePrefs();
      renderList();
    }
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.addEventListener("click", function () { setView(b.getAttribute("data-view")); });
    });

    displaySelect.addEventListener("change", function (event) {
      state.display = event.target.value;
      savePrefs();
      renderList();
    });

    columnsBtn.addEventListener("click", function () { openColumns(columnsBtn); });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-checked", String(state.grouped));
      savePrefs();
      renderList();
    });

    // ----- tap-to-explain -----
    // Every underlined label opens one shared sheet: a plain sentence and
    // the formula, instead of fine print scattered through the page.
    var EXPLAIN = {
      trace: ["Reading a strip",
        "Each trace is the name's cumulative return written on ruled paper. Time runs left to right across the boxes: one heavy box is two months in the list and one month on a name's full strip. Height is the gain printed in the corner, in percent per heavy box; the square pulse at the left is exactly one box tall so the scale can be read off the paper itself. The trace starts at 0% at the beginning of the window on a heavy rule. Every strip picks the smallest gain that fits the year, so a flat trace at 5%/box and a flat trace at 100%/box are very different years. A dashed trace means the name has less than the full window of history.",
        "y = cumulative return ÷ gain · box height; x = session ÷ sessions per box"],
      cap: ["Market cap",
        "Share price times shares outstanding, from the provider's quote — the market's total price for the whole company. It sets the default order and each name's share of the universe. This is full market cap, not the free-float weighting the index itself uses.",
        "price × shares outstanding"],
      ret12: ["12-month return",
        "Total change in the adjusted close over the last 252 trading days — about one year of sessions. Adjusted closes fold in dividends and splits, so this is total return.",
        "close today ÷ first close of the 252-session window − 1"],
      ret6: ["6-month return",
        "Total change in the adjusted close over the last 126 trading days — about half a year. Sits between the year's memory and the quarter's news.",
        "close today ÷ first close of the 126-session window − 1"],
      ret3: ["3-month return",
        "Total change in the adjusted close over the last 63 trading days — about one quarter. Fresh momentum, against the 12-month figure's longer memory.",
        "close today ÷ first close of the 63-session window − 1"],
      ret1: ["1-month return",
        "Total change in the adjusted close over the last 21 trading days — about one month. The shortest lens: what the name did lately, before the quarter and the year have their say.",
        "close today ÷ first close of the 21-session window − 1"],
      offhigh: ["Off 1-year high",
        "How far today's adjusted close sits below the highest close of the past year. Near zero means the name is pressing its high; a deep number means a drawdown.",
        "close today ÷ year's highest close − 1"],
      vsmedian: ["Vs sector median",
        "This name's 12-month return minus the median 12-month return of its sector, in percentage points. Separates a genuine standout from a name merely riding a strong sector.",
        "name's 12m return − sector median 12m return"],
      trend: ["12-month log trend",
        "A straight line fitted to the logarithm of the daily adjusted closes over the past year. On a log scale, steady compounding is a straight line — so the slope reads as the steady growth rate the year implies, shown annualized. The dashed line on the strip is this fit.",
        "slope of best-fit line through ln(close) vs day, compounded over 252 days"],
      r2: ["R²",
        "How much of the year's path the straight trend line explains, from 0 to 1. Near 1: the name ground steadily along its trend. Near 0: the outcome came from swings the trend does not describe.",
        "1 − variance of residuals ÷ variance of ln(close)"],
      quality: ["Quality momentum",
        "The trend's growth rate damped by how reliable the trend was. A steep but chaotic year scores lower than a steady climb — the classic quality-adjusted momentum score.",
        "trend %/yr × R²"],
      median: ["Median return",
        "The middle 12-month return among the sector's names — half did better, half worse. Resistant to one huge winner dragging the average. The sector's trace is this median at every point of the year.",
        "middle value of the sector's 12-month returns"],
      breadth: ["Names up",
        "The share of the sector's names whose 12-month return is positive. The guard on the median: a sector can look healthy on three winners, and breadth says so.",
        "names with positive 12m return ÷ names in sector"]
    };

    // ----- sheets -----
    // Both bottom sheets (a name's detail, an explanation) share one set
    // of mechanics: focus moves in, Tab cycles inside, Esc or the
    // backdrop closes, and focus returns to whatever opened it. The
    // explanation can open on top of the detail; Esc peels the top one.
    var epPop = document.getElementById("explain-pop");
    var epBody = document.getElementById("ep-body");
    var epFormula = document.getElementById("ep-formula");
    var epList = document.getElementById("ep-list");
    var epOpener = null;
    var dpPop = document.getElementById("detail-pop");
    var dpBody = document.getElementById("dp-body");
    var dpOpener = null;

    function lockScroll() {
      document.documentElement.classList.toggle(
        "sheet-open", !epPop.hidden || !dpPop.hidden);
    }
    function focusablesIn(elx) {
      return Array.prototype.filter.call(
        elx.querySelectorAll("button, [href], select, input, [tabindex]:not([tabindex='-1'])"),
        function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function trapTab(event, card) {
      var items = focusablesIn(card);
      if (!items.length) { event.preventDefault(); return; }
      var first = items[0], last = items[items.length - 1];
      var current = document.activeElement;
      if (!card.contains(current)) { event.preventDefault(); first.focus(); }
      else if (event.shiftKey && current === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && current === last) { event.preventDefault(); first.focus(); }
    }
    function returnFocus(opener) {
      if (opener && document.body.contains(opener)) { opener.focus(); return; }
      (state.view === "table" ? tableWrap : listEl).focus();
    }

    function openExplain(key, opener) {
      var entry = EXPLAIN[key];
      if (!entry) return;
      document.getElementById("ep-title").textContent = entry[0];
      epBody.textContent = entry[1];
      epFormula.textContent = entry[2];
      epBody.hidden = false;
      epFormula.hidden = false;
      epList.hidden = true;
      epOpener = opener;
      epPop.hidden = false;
      lockScroll();
      document.getElementById("ep-close").focus();
    }
    function openColumns(opener) {
      document.getElementById("ep-title").textContent = "What the columns mean";
      epBody.textContent = "Tap a column heading to sort by it; tap again to flip " +
        "the direction. A dash means the figure would need more history than " +
        "the name has, so it is left out rather than measured over less.";
      epBody.hidden = false;
      epFormula.hidden = true;
      epList.textContent = "";
      TABLE_COLUMNS.forEach(function (key) {
        var m = METRICS[key];
        var entry = m.explain && EXPLAIN[m.explain];
        if (!entry) return;
        var dt = el("dt", null, m.label);
        var dd = el("dd", null, entry[1]);
        dd.appendChild(el("code", null, entry[2]));
        epList.appendChild(dt);
        epList.appendChild(dd);
      });
      epList.appendChild(el("dt", null, "Leads (sector codes)"));
      epList.appendChild(el("dd", null, sectors.map(function (name) {
        return sectorCode(name) + " " + name;
      }).join(" · ")));
      epList.hidden = false;
      epOpener = opener;
      epPop.hidden = false;
      lockScroll();
      document.getElementById("ep-close").focus();
    }
    function closeExplain() {
      epPop.hidden = true;
      lockScroll();
      var back = epOpener;
      epOpener = null;
      returnFocus(back);
    }

    function openDetail(r, opener) {
      var tick = document.getElementById("dp-ticker");
      tick.textContent = r.ticker;
      document.getElementById("dp-name").textContent = r.name;
      dpBody.textContent = "";
      dpBody.appendChild(detailList(r));
      dpOpener = opener;
      dpPop.hidden = false;
      dpPop.firstElementChild.scrollTop = 0;
      lockScroll();
      document.getElementById("dp-close").focus();
    }
    function closeDetail() {
      dpPop.hidden = true;
      dpBody.textContent = "";
      lockScroll();
      var back = dpOpener;
      dpOpener = null;
      returnFocus(back);
    }

    document.addEventListener("click", function (event) {
      var label = event.target.closest ? event.target.closest("[data-explain]") : null;
      if (label) { openExplain(label.getAttribute("data-explain"), label); }
    });
    epPop.addEventListener("click", function (event) {
      if (event.target === epPop) closeExplain();
    });
    dpPop.addEventListener("click", function (event) {
      if (event.target === dpPop) closeDetail();
    });
    document.getElementById("ep-close").addEventListener("click", closeExplain);
    document.getElementById("dp-close").addEventListener("click", closeDetail);
    document.addEventListener("keydown", function (event) {
      var top = !epPop.hidden ? epPop : !dpPop.hidden ? dpPop : null;
      if (!top) return;
      if (event.key === "Escape") {
        event.preventDefault();
        if (top === epPop) closeExplain(); else closeDetail();
      } else if (event.key === "Tab") {
        trapTab(event, top.firstElementChild);
      }
    });

    function explainLabel(key, text, className) {
      // No key means no sheet applies (a short-history name whose label
      // already says its real window): a plain span, not a dead button.
      if (!key) return el("span", "xl-static", text);
      var b = el("button", className || "xl", text);
      b.type = "button";
      b.setAttribute("data-explain", key);
      return b;
    }

    METRIC_ORDER.forEach(function (key) {
      [sortSelect, displaySelect].forEach(function (sel) {
        var option = document.createElement("option");
        option.value = key;
        option.textContent = METRICS[key].label;
        sel.appendChild(option);
      });
    });
    loadPrefs();
    if (!hasHistory) state.display = "cap";
    displaySelect.value = state.display;
    sortSelect.value = state.sortKey;
    sortDirBtn.firstElementChild.style.transform = state.sortDesc ? "" : "rotate(180deg)";
    sortDirBtn.setAttribute("aria-label",
      "Sort direction: " + (state.sortDesc ? "descending" : "ascending"));
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === state.view));
    });
    groupBtn.setAttribute("aria-checked", String(state.grouped));
    renderTableHead();
    renderFilters();
    paintWatchCount();
    paintWatchMix();
    paintSettingsRows();
    renderList();
    setTab(state.tab);
  })();
</script>
</body>
</html>
