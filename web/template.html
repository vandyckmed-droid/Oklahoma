<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oklahoma Universe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
  :root {
    --ground: #f3f5f4;
    --surface: #ffffff;
    --surface-sunk: #eef1f0;
    --ink: #101917;
    --muted: #5d6b68;
    --faint: #8a9895;
    --line: #dee5e3;
    --accent: #0c6b5f;
    --accent-soft: #e1efec;
    --up: #1a7f52;
    --down: #b4443c;
    --warn: #9a6a17;
    --shadow: 0 1px 2px rgba(16, 25, 23, .06), 0 8px 24px -16px rgba(16, 25, 23, .3);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #000000;
      --surface: #0e0e0e;
      --surface-sunk: #070707;
      --ink: #f5f5f5;
      --muted: #9c9c9c;
      --faint: #6e6e6e;
      --line: #1f1f1f;
      --accent: #00c805;
      --accent-soft: #06290e;
      --up: #00c805;
      --down: #ff5000;
      --warn: #d9a445;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #000000;
    --surface: #0e0e0e;
    --surface-sunk: #070707;
    --ink: #f5f5f5;
    --muted: #9c9c9c;
    --faint: #6e6e6e;
    --line: #1f1f1f;
    --accent: #00c805;
    --accent-soft: #06290e;
    --up: #00c805;
    --down: #ff5000;
    --warn: #d9a445;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 56px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    padding: 28px 0 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 6px;
  }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .note {
    margin: 10px 2px 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }
  .note.stale {
    border: 1px solid var(--warn);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--warn);
  }
  .note b {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 500;
    color: var(--ink);
  }

  /* ---------- price history ---------- */

  .spark {
    display: block;
    width: 54px;
    height: 18px;
    margin-top: 3px;
    margin-left: auto;
    overflow: visible;
  }

  .chg {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .warn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--warn);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  .star-mark { color: var(--warn); font-size: 11px; }
  .watch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .watch-btn {
    border: 1px solid var(--line);
    background: var(--surface-sunk);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .watch-btn[aria-pressed="true"] {
    border-color: var(--warn);
    color: var(--warn);
  }
  .watch-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .watch-ctx {
    font-size: 11px;
    color: var(--muted);
  }
  .detail-meta {
    margin-top: 0;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--faint);
  }
  .detail .series { margin-top: 2px; }
  .detail .series svg {
    display: block;
    width: 100%;
    height: 56px;
    overflow: visible;
  }
  .detail .axis {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--faint);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    margin-top: 3px;
  }

  /* ---------- cross-section ---------- */

  /* A real table: header and rows share columns by construction, and a
     screen reader announces each figure with its column's name. */
  .xs {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  .xs th {
    padding: 8px 12px 5px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
    text-align: right;
  }
  .xs th:first-child { text-align: left; }
  /* Fixed layout: the th widths set the columns; the sector column takes
     the remainder and ellipsizes. */
  .xs th:nth-child(2) { width: 86px; }
  .xs th:last-child { width: 84px; }
  .xs td:last-child { padding-left: 2px; }
  .xs td {
    padding: 7px 12px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
  }
  .xs .sn-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .xs .sector-name {
    max-width: 100%;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .xs .sector-name .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
  }
  .xs .med {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    text-align: right;
  }
  .breadth {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .breadth .track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .breadth .track i {
    display: block;
    height: 100%;
    background: var(--up);
    border-radius: 2px;
  }
  .breadth .pct {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
    width: 30px;
    text-align: right;
  }

  .xtreme {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 8px;
  }
  .xlabel {
    flex: none;
    width: 64px;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .xchips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .xchip {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink);
    cursor: pointer;
  }
  .xchip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- controls ---------- */

  .controls { margin-top: 18px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 12px;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search svg { flex: none; color: var(--faint); }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 11px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-bottom: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
  }
  .chip .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }

  .resultline {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 18px 2px 8px;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .resultline .linebuttons {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .sort-wrap {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--faint);
  }
  .sort-wrap select {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 3px 4px;
    font: inherit;
    font-size: 11px;
    max-width: 118px;
  }
  #sortDir {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 2px 8px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
  }
  .resultline button {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
  }
  .resultline button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  #groupToggle[aria-pressed="true"] {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ---------- list ---------- */

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .list li + li { border-top: 1px solid var(--line); }

  .sector-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    padding: 9px 14px;
    background: var(--surface-sunk);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
  }
  .sector-head:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .sector-head .chev {
    color: var(--faint);
    font-size: 10px;
    width: 10px;
    flex: none;
  }
  .sector-head .n {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;
  }
  .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .rank {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }
  .ticker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .name-cell {
    min-width: 0;
  }
  .company {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .company-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cap-sub {
    flex: none;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
  }
  .cap {
    text-align: right;
  }
  .ret-sub {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
    margin-top: 1px;
  }
  .cap b {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .weight {
    display: block;
    margin-top: 4px;
    margin-left: auto;
    width: 46px;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    overflow: hidden;
  }
  .weight i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--sector, var(--accent));
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sector, var(--faint));
    flex: none;
  }

  .detail {
    padding: 0 14px 14px 52px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 12.5px;
  }
  .fact-line {
    color: var(--muted);
    line-height: 1.5;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 12px 10px;
    background: var(--surface-sunk);
  }
  .stat-cell .xl,
  .stat-cell .xl-static {
    align-self: flex-start;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .stat-val {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
  }
  .stat-sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--faint);
  }

  .trend-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px 12px;
    background: var(--surface-sunk);
  }
  .tc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .tc-title {
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .fit-toggle {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    font-size: 10.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .fit-toggle[aria-pressed="true"] {
    border-color: var(--warn);
    color: var(--warn);
  }
  .fit-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tc-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 8px;
  }
  .tc-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .tc-stat .xl {
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .tc-val {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
  }

  .watch-tools[hidden] { display: none; }
  .watch-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 2px 8px;
  }
  .watch-tools button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 5px 10px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .watch-tools button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .watch-tools-note {
    font-size: 10.5px;
    color: var(--faint);
  }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .xl {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    color: inherit;
    text-align: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    border-bottom: 1px dotted var(--faint);
  }
  .xl:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #explain-pop {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .5);
  }
  #explain-pop[hidden] { display: none; }
  .ep-card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: 18px 18px 20px;
    box-shadow: var(--shadow);
  }
  .ep-card h2 {
    margin: 0 0 6px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
  }
  .ep-card p {
    margin: 0 0 10px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
  }
  .ep-card code {
    display: block;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .ep-card button {
    border: 1px solid var(--line);
    background: var(--surface-sunk);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .ep-card button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    margin-top: 22px;
    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;
  }
  footer code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color .12s ease; }
  }
  @media (min-width: 480px) {
    h1 { font-size: 40px; }
    .company { font-size: 13px; }
  }
</style>

</head>
<body>
<script id="universe-data" type="application/json">__UNIVERSE_JSON__</script>
<script id="history-data" type="application/json">__HISTORY_JSON__</script>

<div class="shell">
  <header class="masthead">
    <p class="eyebrow">U.S. equity universe</p>
    <h1>Oklahoma</h1>
    <p id="subtitle"></p>
  </header>

  <p class="note stale" id="stale-note" hidden></p>
  <p class="note" id="history-note" hidden></p>
  <p class="note" id="changes-note" hidden></p>

  <section id="cross" hidden aria-label="12-month cross-section">
    <div class="resultline"><span id="cross-title"></span></div>
    <table class="xs">
      <thead>
        <tr>
          <th scope="col">Sector</th>
          <th scope="col"><button type="button" class="xl" data-explain="median">Median return</button></th>
          <th scope="col"><button type="button" class="xl" data-explain="breadth">% of names up</button></th>
        </tr>
      </thead>
      <tbody id="xs-sectors"></tbody>
    </table>
    <div class="xtreme"><span class="xlabel">Leaders</span><span id="xs-leaders" class="xchips"></span></div>
    <div class="xtreme"><span class="xlabel">Laggards</span><span id="xs-laggards" class="xchips"></span></div>
  </section>

  <div class="controls">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"></circle>
        <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
      <input id="search" type="search" placeholder="Search ticker, company or sector" autocomplete="off" aria-label="Search the universe">
    </label>
    <div class="filters" id="filters" role="group" aria-label="Filter by sector"></div>
  </div>

  <div class="resultline">
    <span id="resultcount" aria-live="polite"></span>
    <span class="linebuttons">
      <label class="sort-wrap">
        <select id="sortKey" aria-label="Sort by">
          <option value="cap">Market cap</option>
          <option value="ret12">12-mo return</option>
          <option value="ret3">3-mo return</option>
          <option value="quality">Quality momentum</option>
        </select>
      </label>
      <button id="sortDir" type="button" aria-label="Sort direction: descending">↓</button>
      <button id="groupToggle" type="button" aria-pressed="false" aria-label="Group by sector">Group</button>
    </span>
  </div>

  <div class="watch-tools" id="watch-tools" hidden>
    <button id="watch-export" type="button">Copy tickers</button>
    <button id="watch-import" type="button">Paste tickers</button>
    <span class="watch-tools-note">moves your list between devices</span>
  </div>

  <ul class="list" id="list"></ul>

  <footer id="footer"></footer>
</div>

<div id="explain-pop" hidden role="dialog" aria-modal="true" aria-labelledby="ep-title">
  <div class="ep-card">
    <h2 id="ep-title"></h2>
    <p id="ep-body"></p>
    <code id="ep-formula"></code>
    <button id="ep-close" type="button">Close</button>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var universe = JSON.parse(document.getElementById("universe-data").textContent);
    var rows = universe.constituents || [];

    var history = JSON.parse(document.getElementById("history-data").textContent);
    var coverage = {};
    ((history && history.coverage) || []).forEach(function (entry) {
      coverage[entry.ticker] = entry;
    });
    var hasHistory = Boolean(history && history.coverage && history.coverage.length);

    var SECTOR_COLORS = {
      "Technology": "#3f8ecf",
      "Communication Services": "#7a6ed0",
      "Consumer Cyclical": "#d08a3f",
      "Consumer Defensive": "#a99a35",
      "Financial Services": "#2fa08a",
      "Healthcare": "#cf5f7a",
      "Energy": "#a5623c",
      "Industrials": "#6f8ba0",
      "Basic Materials": "#4fa04f",
      "Real Estate": "#c07ab0",
      "Utilities": "#c9a93c",
      "Unclassified": "#8a9895"
    };
    function sectorColor(name) {
      return SECTOR_COLORS[name] || "#8a9895";
    }

    function money(value) {
      if (value >= 1e12) return "$" + (value / 1e12).toFixed(2) + "T";
      if (value >= 1e9) return "$" + (value / 1e9).toFixed(0) + "B";
      if (value >= 1e6) return "$" + (value / 1e6).toFixed(0) + "M";
      return "$" + value.toLocaleString();
    }

    function pct(value) {
      if (value == null) return "—";
      return (value > 0 ? "+" : "") + value.toFixed(2) + "%";
    }

    function direction(value) {
      if (value == null) return "flat";
      if (value > 0.005) return "up";
      if (value < -0.005) return "down";
      return "flat";
    }

    var SVG = "http://www.w3.org/2000/svg";

    function sparkPoints(series, width, height, baseline, domain) {
      var lo = Math.min.apply(null, domain || series);
      var hi = Math.max.apply(null, domain || series);
      if (baseline != null) {
        lo = Math.min(lo, baseline);
        hi = Math.max(hi, baseline);
      }
      var span = hi - lo || 1;
      var step = series.length > 1 ? width / (series.length - 1) : 0;
      var pts = series.map(function (value, i) {
        return [i * step, height - ((value - lo) / span) * height];
      });
      pts.baselineY = baseline == null
        ? height
        : height - ((baseline - lo) / span) * height;
      return pts;
    }

    function spark(series, width, height, stroke, withFill, baseline, overlay) {
      var svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      if (!series || series.length < 2) return svg;

      var domain = overlay ? series.concat(overlay) : null;
      var pts = sparkPoints(series, width, height, baseline, domain);
      var d = pts.map(function (p, i) {
        return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
      }).join(" ");
      var floor = pts.baselineY.toFixed(2);

      if (withFill) {
        var area = document.createElementNS(SVG, "path");
        area.setAttribute("fill", stroke);
        area.setAttribute("fill-opacity", "0.16");
        area.setAttribute("d", d + " L" + width + " " + floor + " L0 " + floor + " Z");
        svg.appendChild(area);
      }

      if (baseline != null) {
        var rule = document.createElementNS(SVG, "line");
        rule.setAttribute("x1", "0");
        rule.setAttribute("x2", String(width));
        rule.setAttribute("y1", floor);
        rule.setAttribute("y2", floor);
        rule.setAttribute("stroke-width", "1");
        rule.setAttribute("stroke-dasharray", "3 4");
        rule.style.stroke = "var(--faint)";
        rule.style.opacity = ".55";
        svg.appendChild(rule);
      }

      var line = document.createElementNS(SVG, "path");
      line.setAttribute("d", d);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke-width", "1.4");
      line.setAttribute("stroke", stroke);
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("stroke-linejoin", "round");
      svg.appendChild(line);

      if (overlay && overlay.length > 1) {
        var opts = sparkPoints(overlay, width, height, baseline, domain);
        var od = opts.map(function (p, i) {
          return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2);
        }).join(" ");
        var fitLine = document.createElementNS(SVG, "path");
        fitLine.setAttribute("d", od);
        fitLine.setAttribute("fill", "none");
        fitLine.setAttribute("stroke-width", "1.3");
        fitLine.setAttribute("stroke-dasharray", "4 3");
        fitLine.style.stroke = "var(--warn)";
        svg.appendChild(fitLine);
      }

      // The endpoint is where the price actually is; mark it.
      var end = pts[pts.length - 1];
      var dot = document.createElementNS(SVG, "circle");
      dot.setAttribute("cx", end[0].toFixed(2));
      dot.setAttribute("cy", end[1].toFixed(2));
      dot.setAttribute("r", "1.7");
      dot.setAttribute("fill", stroke);
      svg.appendChild(dot);
      return svg;
    }

    function asOf(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    var totalCap = rows.reduce(function (sum, r) { return sum + r.market_cap; }, 0);
    var largestCap = rows.reduce(function (max, r) { return Math.max(max, r.market_cap); }, 0);

    var sectorCounts = {};
    rows.forEach(function (r) {
      sectorCounts[r.sector] = (sectorCounts[r.sector] || 0) + 1;
    });
    var sectors = Object.keys(sectorCounts).sort(function (a, b) {
      return sectorCounts[b] - sectorCounts[a] || a.localeCompare(b);
    });

    var sourceName = (universe.source && universe.source.index) || "U.S.-listed companies";
    document.getElementById("subtitle").textContent =
      universe.count + " " + sourceName + " constituents · " + money(totalCap) +
      " · " + sectors.length + " sectors · as of " + asOf(universe.generated_at);
    var ageDays = (Date.now() - new Date(universe.generated_at)) / 86400000;
    if (ageDays > 5) {
      var stale = document.getElementById("stale-note");
      stale.hidden = false;
      stale.textContent =
        "This data is " + Math.floor(ageDays) + " days old. The daily refresh " +
        "may be failing \u2014 check the repository's Actions tab.";
    }

    if (hasHistory) {
      var target = history.criteria.trading_days_target;
      var short = history.coverage.filter(function (e) { return !e.sufficient; });
      var note = document.getElementById("history-note");
      note.hidden = false;
      if (short.length) {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) + ". " +
          short.length + " name" + (short.length > 1 ? "s have" : " has") +
          " less than " + target + " trading days of history: " +
          short.map(function (e) {
            return "<b>" + e.ticker + "</b> (" + e.trading_days + "d)";
          }).join(", ") + ".";
      } else {
        note.innerHTML =
          "Adjusted close through " + asOf(history.generated_at) +
          ". Every name covers at least " + target + " trading days.";
      }
    }

    var changes = (history && history.recent_changes) || [];
    if (changes.length) {
      var parts = [];
      changes.slice().reverse().forEach(function (event) {
        var bits = [];
        event.joined.forEach(function (r) { bits.push("+" + r.ticker); });
        event.left.forEach(function (r) { bits.push("\u2212" + r.ticker); });
        event.renamed.forEach(function (r) { bits.push(r.from_ticker + "\u2192" + r.to_ticker); });
        parts.push(asOf(event.observed_at) + ": <b>" + bits.join("</b>, <b>") + "</b>");
      });
      var changesNote = document.getElementById("changes-note");
      changesNote.hidden = false;
      changesNote.innerHTML = "Membership changes \u2014 " + parts.join(" \u00b7 ");
    }

    var cross = history && history.cross_section;
    var rowByTicker = {};
    rows.forEach(function (r) { rowByTicker[r.ticker] = r; });
    var medianBySector = {};
    ((cross && cross.sectors) || []).forEach(function (row) {
      medianBySector[row.sector] = row.median_return_pct;
    });
    if (cross) {
      document.getElementById("cross").hidden = false;
      document.getElementById("cross-title").textContent =
        "12-month cross-section \u00b7 " + cross.names_used + " names";

      var sectorList = document.getElementById("xs-sectors");
      cross.sectors.forEach(function (row) {
        var tr = document.createElement("tr");
        var nameCell = document.createElement("td");
        var medCell = document.createElement("td");
        var breadthCell = document.createElement("td");

        var name = document.createElement("span");
        name.className = "sector-name";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.style.cssText =
          "width:7px;height:7px;border-radius:50%;flex:none;background:" +
          sectorColor(row.sector);
        name.appendChild(dot);
        var label = document.createElement("span");
        label.className = "sn-text";
        label.textContent = row.sector;
        name.appendChild(label);
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = row.count;
        name.appendChild(n);

        medCell.className = "med " + direction(row.median_return_pct);
        medCell.textContent = pct(row.median_return_pct);

        var breadth = document.createElement("span");
        breadth.className = "breadth";
        breadth.title = row.breadth_pct + "% of names positive";
        var track = document.createElement("span");
        track.className = "track";
        var fill = document.createElement("i");
        fill.style.width = row.breadth_pct + "%";
        track.appendChild(fill);
        var pctEl = document.createElement("span");
        pctEl.className = "pct";
        pctEl.textContent = Math.round(row.breadth_pct) + "%";
        breadth.appendChild(track);
        breadth.appendChild(pctEl);

        nameCell.appendChild(name);
        breadthCell.appendChild(breadth);
        tr.appendChild(nameCell);
        tr.appendChild(medCell);
        tr.appendChild(breadthCell);
        sectorList.appendChild(tr);
      });

      function chipRow(container, names) {
        names.forEach(function (row) {
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "xchip";
          var tick = document.createElement("span");
          tick.textContent = row.ticker + " ";
          var value = document.createElement("span");
          value.className = direction(row.return_pct);
          value.textContent = pct(row.return_pct);
          chip.appendChild(tick);
          chip.appendChild(value);
          chip.addEventListener("click", function () {
            var input = document.getElementById("search");
            input.value = row.ticker;
            state.query = row.ticker;
            // The chip names one specific ticker; an active sector filter
            // would only hide it, so clear the filter with the chips' UI.
            state.sector = null;
            renderFilters();
            renderList();
            listEl.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          container.appendChild(chip);
        });
      }
      chipRow(document.getElementById("xs-leaders"), cross.leaders);
      chipRow(document.getElementById("xs-laggards"), cross.laggards);
    }

    var source = universe.source || {};
    document.getElementById("footer").innerHTML =
      "Data from " + (source.provider || "the configured provider") +
      ", <code>" + (source.endpoint || "") + "</code>. The universe mirrors current " +
      sourceName + " membership; <code>python -m oklahoma refresh</code> updates it." +
      (hasHistory
        ? " Prices are split- and dividend-adjusted closes; the page carries a thinned " +
          "series per name, the full history lives in <code>data/history/</code>."
        : "");

    /* ----- state ----- */

    var state = {
      query: "", sector: null, grouped: false,
      sortKey: "cap", sortDesc: true, watchOnly: false, showTrend: false
    };
    var collapsedSectors = new Set();

    // The watchlist lives in this browser only (localStorage) — a personal
    // shortlist, not synced state. Storage can be unavailable (private
    // windows, blocked site data), so every touch is guarded and the page
    // works identically with nothing stored.
    var WATCH_KEY = "oklahoma-watchlist";
    function loadWatch() {
      try {
        return new Set(JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"));
      } catch (e) { return new Set(); }
    }
    function saveWatch() {
      try {
        localStorage.setItem(WATCH_KEY, JSON.stringify(Array.from(watch)));
      } catch (e) { /* per-viewer convenience only */ }
    }
    var watch = loadWatch();
    watch.forEach(function (t) { if (!rowByTicker[t]) watch.delete(t); });
    saveWatch();

    // The universe arrives ranked by market cap, so "cap" keeps the given
    // order. Return sorts use the 12-month figure; names without one
    // (too little history) always sink to the bottom.
    var SORT_FIELDS = {
      ret12: "window_return_pct",
      ret3: "return_3m_pct",
      quality: "quality_pct"
    };
    function ordered(rows_) {
      if (state.sortKey === "cap") {
        return state.sortDesc ? rows_ : rows_.slice().reverse();
      }
      var field = SORT_FIELDS[state.sortKey];
      var sign = state.sortDesc ? -1 : 1;
      // A 54-day return must not rank inside a 12-month ordering; the
      // 3-month and quality fields are absent below their own windows,
      // but window_return_pct exists for any span and needs the gate.
      var needsFull = state.sortKey === "ret12";
      return rows_.slice().sort(function (a, b) {
        var ca = coverage[a.ticker], cb = coverage[b.ticker];
        var ra = ca && ca[field] != null && (!needsFull || ca.sufficient) ? ca[field] : null;
        var rb = cb && cb[field] != null && (!needsFull || cb.sufficient) ? cb[field] : null;
        if (ra == null && rb == null) return 0;
        if (ra == null) return 1;
        if (rb == null) return -1;
        return sign * (ra - rb);
      });
    }
    var openRow = { ticker: null, li: null };

    function closeOpenRow() {
      if (openRow.li) {
        var detail = openRow.li.querySelector(".detail");
        if (detail) detail.remove();
        var btn = openRow.li.querySelector(".row");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
      openRow.ticker = null;
      openRow.li = null;
    }

    // 503 rows is too many to build in one synchronous pass on a phone,
    // so the list paints in frame-sized chunks: the first screenful is
    // instant and the rest streams in. A newer paint cancels an older one.
    var paintToken = 0;
    var afterPaint = null;
    function paintList(items, makeNode) {
      var token = ++paintToken;
      listEl.textContent = "";
      var i = 0;
      function step() {
        if (token !== paintToken) return;
        var frag = document.createDocumentFragment();
        for (var end = Math.min(i + 80, items.length); i < end; i++) {
          frag.appendChild(makeNode(items[i]));
        }
        listEl.appendChild(frag);
        if (i < items.length) {
          requestAnimationFrame(step);
        } else if (afterPaint) {
          // Chunked painting means a caller cannot touch late rows right
          // after renderList() returns; this runs once the last chunk lands.
          var hook = afterPaint;
          afterPaint = null;
          hook();
        }
      }
      step();
    }

    var filtersEl = document.getElementById("filters");
    var listEl = document.getElementById("list");
    var resultEl = document.getElementById("resultcount");
    var groupBtn = document.getElementById("groupToggle");

    function chip(label, value, count, color) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(state.sector === value));
      if (color) b.style.setProperty("--sector", color);
      if (color) {
        var dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.appendChild(document.createTextNode(label));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () {
        state.sector = state.sector === value ? null : value;
        renderFilters();
        renderList();
      });
      return b;
    }

    function renderFilters() {
      filtersEl.textContent = "";
      filtersEl.appendChild(chip("All", null, rows.length, null));

      var wchip = document.createElement("button");
      wchip.type = "button";
      wchip.className = "chip";
      wchip.id = "watch-chip";
      wchip.setAttribute("aria-pressed", String(state.watchOnly));
      wchip.appendChild(document.createTextNode("\u2605 Watchlist"));
      var wn = document.createElement("span");
      wn.className = "n";
      wn.id = "watch-count";
      wn.textContent = watch.size;
      wchip.appendChild(wn);
      wchip.addEventListener("click", function () {
        state.watchOnly = !state.watchOnly;
        renderFilters();
        renderList();
      });
      filtersEl.appendChild(wchip);
      sectors.forEach(function (s) {
        filtersEl.appendChild(chip(s, s, sectorCounts[s], sectorColor(s)));
      });
    }

    function visible() {
      var q = state.query.trim().toLowerCase();
      return rows.filter(function (r) {
        if (state.watchOnly && !watch.has(r.ticker)) return false;
        if (state.sector && r.sector !== state.sector) return false;
        if (!q) return true;
        return (
          r.ticker.toLowerCase().indexOf(q) !== -1 ||
          r.name.toLowerCase().indexOf(q) !== -1 ||
          r.sector.toLowerCase().indexOf(q) !== -1 ||
          (r.industry || "").toLowerCase().indexOf(q) !== -1
        );
      });
    }

    function detailList(r) {
      var dl = document.createElement("div");
      dl.className = "detail";
      var cov = coverage[r.ticker];

      // Identity in one quiet line; the numbers get the structure.
      var facts = document.createElement("div");
      facts.className = "fact-line";
      var bits = [r.sector, r.industry,
        money(r.market_cap) + " (" + ((r.market_cap / totalCap) * 100).toFixed(2) + "% of universe)"];
      if (r.share_classes && r.share_classes.length > 1) {
        bits.push("classes " + r.share_classes.join(" + "));
      }
      facts.textContent = bits.filter(Boolean).join(" \u00b7 ");
      dl.appendChild(facts);

      function statCell(key, label, value, cls, sub) {
        var cell = document.createElement("div");
        cell.className = "stat-cell";
        cell.appendChild(explainLabel(key, label));
        var v = document.createElement("span");
        v.className = "stat-val" + (cls ? " " + cls : "");
        v.textContent = value;
        cell.appendChild(v);
        if (sub) {
          var sb = document.createElement("span");
          sb.className = "stat-sub";
          sb.textContent = sub;
          cell.appendChild(sb);
        }
        return cell;
      }

      if (cov && cov.window_return_pct != null) {
        var grid = document.createElement("div");
        grid.className = "stat-grid";
        grid.appendChild(statCell(cov.sufficient ? "ret12" : null,
          cov.sufficient ? "12-mo return" : cov.window_trading_days + "-day return",
          pct(cov.window_return_pct), direction(cov.window_return_pct)));
        if (cov.return_3m_pct != null) {
          grid.appendChild(statCell("ret3", "3-mo return",
            pct(cov.return_3m_pct), direction(cov.return_3m_pct)));
        }
        if (cov.window_high != null && cov.last_adj_close != null) {
          var offHigh = (cov.last_adj_close / cov.window_high - 1) * 100;
          grid.appendChild(statCell(cov.sufficient ? "offhigh" : null,
            cov.sufficient ? "Off 1y high" : "Off " + cov.window_trading_days + "-day high",
            offHigh > -0.5 ? "at its high" : offHigh.toFixed(1) + "%",
            offHigh > -0.5 ? "up" : direction(offHigh)));
        }
        var med = medianBySector[r.sector];
        if (med != null && cov.sufficient) {
          var delta = cov.window_return_pct - med;
          grid.appendChild(statCell("vsmedian", "Vs sector",
            (delta > 0 ? "+" : "") + delta.toFixed(1) + " pts",
            direction(delta), "median " + pct(med)));
        }
        dl.appendChild(grid);
      }

      var cumSeries = cov && cov.cum_return_spark;
      if (cumSeries && cumSeries.length > 1) {
        var card = document.createElement("div");
        card.className = "trend-card";

        var head = document.createElement("div");
        head.className = "tc-head";
        var title = document.createElement("span");
        title.className = "tc-title";
        title.textContent = "Price path, " + cov.window_trading_days + " trading days";
        head.appendChild(title);
        card.appendChild(head);

        var hasFit = cov.fit_spark && cov.fit_spark.length > 1;
        if (hasFit) {
          var stats = document.createElement("div");
          stats.className = "tc-stats";
          function tcStat(key, label, value, cls) {
            var wrap = document.createElement("span");
            wrap.className = "tc-stat";
            wrap.appendChild(explainLabel(key, label));
            var v = document.createElement("span");
            v.className = "tc-val" + (cls ? " " + cls : "");
            v.textContent = value;
            wrap.appendChild(v);
            return wrap;
          }
          stats.appendChild(tcStat("trend", "Trend",
            pct(cov.trend_ann_pct) + "/yr", direction(cov.trend_ann_pct)));
          stats.appendChild(tcStat("r2", "R\u00b2", cov.trend_r2.toFixed(2)));
          stats.appendChild(tcStat("quality", "Quality",
            pct(cov.quality_pct) + "/yr", direction(cov.quality_pct)));
          card.appendChild(stats);

          var toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "fit-toggle";
          head.appendChild(toggle);
        }

        var chartHolder = document.createElement("div");
        chartHolder.className = "series";
        card.appendChild(chartHolder);
        function renderChart() {
          chartHolder.textContent = "";
          var stroke = getComputedStyle(document.documentElement)
            .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
          chartHolder.appendChild(spark(
            cumSeries, 300, 56, stroke, true, 0,
            hasFit && state.showTrend ? cov.fit_spark : null
          ));
          if (hasFit) {
            toggle.textContent = state.showTrend ? "Hide trend line" : "Show trend line";
            toggle.setAttribute("aria-pressed", String(state.showTrend));
          }
        }
        if (hasFit) {
          toggle.addEventListener("click", function () {
            state.showTrend = !state.showTrend;
            renderChart();
          });
        }
        renderChart();

        var axis = document.createElement("div");
        axis.className = "axis";
        var from = document.createElement("span");
        from.textContent = cov.window_start_date || cov.start_date;
        var to = document.createElement("span");
        to.textContent = cov.end_date;
        axis.appendChild(from);
        axis.appendChild(to);
        card.appendChild(axis);
        dl.appendChild(card);
      }

      var watchRow = document.createElement("div");
      watchRow.className = "watch-row";
      watchRow.style.marginTop = "0";
      var watchBtn = document.createElement("button");
      watchBtn.type = "button";
      watchBtn.className = "watch-btn";
      var watchCtx = document.createElement("span");
      watchCtx.className = "watch-ctx";
      function paintWatch() {
        var on = watch.has(r.ticker);
        watchBtn.textContent = on ? "\u2605 On watchlist" : "\u2606 Add to watchlist";
        watchBtn.setAttribute("aria-pressed", String(on));
        // Distinctness at a glance: what the shortlist already holds, and
        // how much of it sits in this same sector.
        var inSector = 0;
        watch.forEach(function (t) {
          if (t === r.ticker) return;
          var rec = rowByTicker[t];
          if (rec && rec.sector === r.sector) inSector++;
        });
        watchCtx.textContent = !watch.size
          ? ""
          : "Watching " + watch.size + (inSector
              ? " \u00b7 " + inSector + " already in " + r.sector
              : " \u00b7 none in " + r.sector);
      }
      watchBtn.addEventListener("click", function () {
        if (watch.has(r.ticker)) watch.delete(r.ticker);
        else watch.add(r.ticker);
        saveWatch();
        paintWatch();
        var count = document.getElementById("watch-count");
        if (count) count.textContent = watch.size;
        if (state.watchOnly) {
          var chipEl = document.getElementById("watch-chip");
          if (chipEl) chipEl.focus();
          renderList();
          return;
        }
        var tick = openRow.li && openRow.li.querySelector(".ticker");
        if (tick) {
          var existing = tick.querySelector(".star-mark");
          if (existing) existing.remove();
          if (watch.has(r.ticker)) {
            var mark = document.createElement("span");
            mark.className = "star-mark";
            mark.textContent = " \u2605";
            mark.setAttribute("role", "img");
            mark.setAttribute("aria-label", "on watchlist");
            tick.appendChild(mark);
          }
        }
      });
      paintWatch();
      watchRow.appendChild(watchBtn);
      watchRow.appendChild(watchCtx);
      dl.appendChild(watchRow);

      if (cov) {
        var meta = document.createElement("div");
        meta.className = "detail-meta";
        var bits = [];
        if (r.exchange) bits.push(r.exchange);
        bits.push(cov.trading_days + " trading days, " +
          cov.start_date + " \u2192 " + cov.end_date);
        if (cov.window_low != null) {
          bits.push("range $" + cov.window_low.toLocaleString() +
            "\u2013$" + cov.window_high.toLocaleString());
        }
        if (cov.last_adj_close != null) {
          bits.push("last adj. close $" + cov.last_adj_close.toLocaleString());
        }
        meta.textContent = bits.join(" \u00b7 ");
        dl.appendChild(meta);
      }
      return dl;
    }

    function rowItem(r) {
      var li = document.createElement("li");
      var color = sectorColor(r.sector);
      var cov = coverage[r.ticker];

      var button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.setAttribute("aria-expanded", "false");
      button.style.setProperty("--sector", color);

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = r.rank;

      var main = document.createElement("span");
      main.className = "name-cell";
      var ticker = document.createElement("span");
      ticker.className = "ticker";
      ticker.textContent = r.ticker;
      if (watch.has(r.ticker)) {
        var mark = document.createElement("span");
        mark.className = "star-mark";
        mark.textContent = " \u2605";
        mark.setAttribute("role", "img");
        mark.setAttribute("aria-label", "on watchlist");
        ticker.appendChild(mark);
      }
      if (cov && !cov.sufficient) {
        var warn = document.createElement("span");
        warn.className = "warn";
        warn.textContent = cov.trading_days + "d";
        warn.title = "Only " + cov.trading_days + " trading days of history";
        ticker.appendChild(document.createTextNode(" "));
        ticker.appendChild(warn);
      }

      var company = document.createElement("span");
      company.className = "company";
      var companyName = document.createElement("span");
      companyName.className = "company-name";
      companyName.textContent = r.name;
      var capSub = document.createElement("span");
      capSub.className = "cap-sub";
      capSub.textContent = money(r.market_cap);
      company.appendChild(companyName);
      company.appendChild(capSub);
      main.appendChild(ticker);
      main.appendChild(company);

      var cap = document.createElement("span");
      cap.className = "cap";
      var capValue = document.createElement("b");
      if (cov && cov.window_return_pct != null) {
        capValue.className = direction(cov.window_return_pct);
        capValue.textContent = pct(cov.window_return_pct);
      } else {
        capValue.textContent = money(r.market_cap);
      }
      cap.appendChild(capValue);
      if (cov && cov.return_3m_pct != null) {
        var sub = document.createElement("span");
        sub.className = "ret-sub " + direction(cov.return_3m_pct);
        sub.textContent = "3m " + pct(cov.return_3m_pct);
        cap.appendChild(sub);
      }

      if (cov && cov.cum_return_spark && cov.cum_return_spark.length > 1) {
        var stroke = getComputedStyle(document.documentElement)
          .getPropertyValue(cov.window_return_pct >= 0 ? "--up" : "--down").trim();
        var mini = spark(cov.cum_return_spark, 54, 18, stroke, false);
        mini.setAttribute("class", "spark");
        cap.appendChild(mini);
      } else {
        var bar = document.createElement("span");
        bar.className = "weight";
        var fill = document.createElement("i");
        fill.style.width = Math.max(4, (r.market_cap / largestCap) * 100) + "%";
        bar.appendChild(fill);
        cap.appendChild(bar);
      }

      button.appendChild(rank);
      button.appendChild(main);
      button.appendChild(cap);
      button.addEventListener("click", function () {
        var wasOpen = openRow.ticker === r.ticker;
        closeOpenRow();
        if (!wasOpen) {
          button.setAttribute("aria-expanded", "true");
          li.appendChild(detailList(r));
          openRow.ticker = r.ticker;
          openRow.li = li;
        }
      });

      li.appendChild(button);
      return li;
    }

    function sectorHeader(name, count) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sector-head";
      var collapsed = collapsedSectors.has(name);
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.setAttribute("data-sector", name);
      var chev = document.createElement("span");
      chev.className = "chev";
      chev.setAttribute("aria-hidden", "true");
      chev.textContent = collapsed ? "\u25b8" : "\u25be";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.cssText =
        "width:7px;height:7px;border-radius:50%;flex:none;background:" +
        sectorColor(name);
      btn.appendChild(chev);
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(name));
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      btn.appendChild(n);
      btn.addEventListener("click", function () {
        if (collapsedSectors.has(name)) collapsedSectors.delete(name);
        else collapsedSectors.add(name);
        // The header re-renders in place; put keyboard focus back on it
        // once the (chunked) repaint has actually created it.
        afterPaint = function () {
          var again = listEl.querySelector(
            '.sector-head[data-sector="' + CSS.escape(name) + '"]'
          );
          if (again) again.focus();
        };
        renderList();
      });
      li.appendChild(btn);
      return li;
    }

    function renderList() {
      closeOpenRow();
      document.getElementById("watch-tools").hidden = !state.watchOnly;
      var shown = ordered(visible());
      listEl.textContent = "";
      resultEl.textContent =
        shown.length === rows.length
          ? "All " + rows.length + " names"
          : shown.length + " of " + rows.length + " names";

      if (!shown.length) {
        var li = document.createElement("li");
        li.className = "empty";
        li.textContent = state.watchOnly && !watch.size
          ? "Your watchlist is empty. Open a name and tap \u2606 Add to watchlist."
          : state.watchOnly
            ? "No watchlist name matches. The \u2605 Watchlist filter is on."
            : "Nothing matches “" + state.query.trim() + "”. Try a ticker or sector.";
        listEl.appendChild(li);
        return;
      }

      var items = [];
      if (state.grouped) {
        sectors.forEach(function (s) {
          var group = shown.filter(function (r) { return r.sector === s; });
          if (!group.length) return;
          items.push({ header: s, count: group.length });
          if (collapsedSectors.has(s)) return;
          group.forEach(function (r) { items.push({ row: r }); });
        });
      } else {
        shown.forEach(function (r) { items.push({ row: r }); });
      }
      paintList(items, function (item) {
        return item.header
          ? sectorHeader(item.header, item.count)
          : rowItem(item.row);
      });
    }

    var searchTimer;
    document.getElementById("search").addEventListener("input", function (event) {
      state.query = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderList, 120);
    });

    document.getElementById("watch-export").addEventListener("click", function (event) {
      var text = Array.from(watch).sort().join(", ");
      var btn = event.target;
      function done(label) {
        btn.textContent = label;
        setTimeout(function () { btn.textContent = "Copy tickers"; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { done("Copied"); },
          function () { window.prompt("Copy your watchlist:", text); done("Copy tickers"); }
        );
      } else {
        window.prompt("Copy your watchlist:", text);
      }
    });

    document.getElementById("watch-import").addEventListener("click", function () {
      var input = window.prompt("Paste tickers (comma or space separated):", "");
      if (!input) return;
      var added = 0, unknown = [];
      input.toUpperCase().split(/[^A-Z0-9.\-]+/).forEach(function (t) {
        if (!t) return;
        if (rowByTicker[t]) {
          if (!watch.has(t)) { watch.add(t); added++; }
        } else {
          unknown.push(t);
        }
      });
      saveWatch();
      var count = document.getElementById("watch-count");
      if (count) count.textContent = watch.size;
      renderList();
      if (unknown.length) {
        window.alert("Added " + added + ". Not in the universe: " + unknown.join(", "));
      }
    });

    document.getElementById("sortKey").addEventListener("change", function (event) {
      state.sortKey = event.target.value;
      renderList();
    });
    var sortDirBtn = document.getElementById("sortDir");
    sortDirBtn.addEventListener("click", function () {
      state.sortDesc = !state.sortDesc;
      sortDirBtn.textContent = state.sortDesc ? "\u2193" : "\u2191";
      sortDirBtn.setAttribute("aria-label",
        "Sort direction: " + (state.sortDesc ? "descending" : "ascending"));
      renderList();
    });

    groupBtn.addEventListener("click", function () {
      state.grouped = !state.grouped;
      groupBtn.setAttribute("aria-pressed", String(state.grouped));
      renderList();
    });

    // ----- tap-to-explain -----
    // Every underlined label opens one shared sheet: a plain sentence and
    // the formula, instead of fine print scattered through the page.
    var EXPLAIN = {
      ret12: ["12-month return",
        "Total change in the adjusted close over the last 252 trading days — about one year of sessions. Adjusted closes fold in dividends and splits, so this is total return.",
        "close today \u00f7 first close of the 252-session window \u2212 1"],
      ret3: ["3-month return",
        "Total change in the adjusted close over the last 63 trading days — about one quarter. Fresh momentum, against the 12-month figure's longer memory.",
        "close today \u00f7 first close of the 63-session window \u2212 1"],
      offhigh: ["Off 1-year high",
        "How far today's adjusted close sits below the highest close of the past year. Near zero means the name is pressing its high; a deep number means a drawdown.",
        "close today \u00f7 year's highest close \u2212 1"],
      vsmedian: ["Vs sector median",
        "This name's 12-month return minus the median 12-month return of its sector, in percentage points. Separates a genuine standout from a name merely riding a strong sector.",
        "name's 12m return \u2212 sector median 12m return"],
      trend: ["12-month log trend",
        "A straight line fitted to the logarithm of the daily adjusted closes over the past year. On a log scale, steady compounding is a straight line — so the slope reads as the steady growth rate the year implies, shown annualized. The dashed line on the chart is this fit.",
        "slope of best-fit line through ln(close) vs day, compounded over 252 days"],
      r2: ["R\u00b2",
        "How much of the year's path the straight trend line explains, from 0 to 1. Near 1: the name ground steadily along its trend. Near 0: the outcome came from swings the trend does not describe.",
        "1 \u2212 variance of residuals \u00f7 variance of ln(close)"],
      quality: ["Quality momentum",
        "The trend's growth rate damped by how reliable the trend was. A steep but chaotic year scores lower than a steady climb — the classic quality-adjusted momentum score.",
        "trend %/yr \u00d7 R\u00b2"],
      median: ["Median return",
        "The middle 12-month return among the sector's names — half did better, half worse. Resistant to one huge winner dragging the average.",
        "middle value of the sector's 12-month returns"],
      breadth: ["% of names up",
        "The share of the sector's names whose 12-month return is positive. The guard on the median: a sector can look healthy on three winners, and breadth says so.",
        "names with positive 12m return \u00f7 names in sector"]
    };

    var epPop = document.getElementById("explain-pop");
    var epOpener = null;
    function openExplain(key, opener) {
      var entry = EXPLAIN[key];
      if (!entry) return;
      document.getElementById("ep-title").textContent = entry[0];
      document.getElementById("ep-body").textContent = entry[1];
      document.getElementById("ep-formula").textContent = entry[2];
      epOpener = opener;
      epPop.hidden = false;
      document.getElementById("ep-close").focus();
    }
    function closeExplain() {
      epPop.hidden = true;
      if (epOpener) { epOpener.focus(); epOpener = null; }
    }
    document.addEventListener("click", function (event) {
      var label = event.target.closest ? event.target.closest(".xl") : null;
      if (label) { openExplain(label.getAttribute("data-explain"), label); }
    });
    epPop.addEventListener("click", function (event) {
      if (event.target === epPop) closeExplain();
    });
    document.getElementById("ep-close").addEventListener("click", closeExplain);
    document.addEventListener("keydown", function (event) {
      if (epPop.hidden) return;
      if (event.key === "Escape") closeExplain();
      // Close is the sheet's only focusable stop, so holding focus there
      // is what makes the aria-modal claim true.
      if (event.key === "Tab") event.preventDefault();
    });

    function explainLabel(key, text) {
      // No key means no sheet applies (a short-history name whose label
      // already says its real window): a plain span, not a dead button.
      if (!key) {
        var s = document.createElement("span");
        s.className = "xl-static";
        s.textContent = text;
        return s;
      }
      var b = document.createElement("button");
      b.type = "button";
      b.className = "xl";
      b.setAttribute("data-explain", key);
      b.textContent = text;
      return b;
    }

    renderFilters();
    renderList();
  })();
</script>
</body>
</html>
