# Oklahoma quotes proxy.
#
# Holds the Financial Modeling Prep key so the public GitHub Pages site
# never ships it. It is deployed by .github/workflows/deploy-worker.yml on
# every push to main that touches worker/, using the FMP_API_KEY and
# CLOUDFLARE_API_TOKEN repository secrets. To deploy by hand instead:
#
#   npx wrangler login
#   npx wrangler secret put FMP_API_KEY
#   npx wrangler deploy
name = "oklahoma-quotes"
main = "src/index.js"
compatibility_date = "2026-09-01"
[vars]
# Origins allowed to call this Worker, comma separated. The page's own
# origin plus a local dev server.
ALLOWED_ORIGINS = "https://vandyckmed-droid.github.io,http://localhost:8000,http://127.0.0.1:8000"
# Seconds a batch of quotes is cached at the edge before FMP is asked again.
CACHE_SECONDS = "60"

# Per-IP request budget; the page sends six requests per load, and the
# 60-second edge cache absorbs reloads, so 60 a minute is generous.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Refuse to deploy unless the FMP key is bound, so a missing secret fails
# the deploy loudly instead of returning 500s at runtime.
[secrets]
required = ["FMP_API_KEY"]
